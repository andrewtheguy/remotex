name: Frontend bundle

# The web client, built once: one bundle, platform-independent, holding the
# WebAssembly modules the frontend's own build makes: the compositor, from the
# gateway's graphics crate (frontend/wasm/egfx) with the nightly toolchain that
# directory pins, and the lossless sound's decoder (frontend/wasm/flac) and a
# Mac's own picture's, Adaptive or Full (frontend/wasm/vnc), with stable.
# The release workflow calls this for the bundle every platform build stages
# through REMOTEX_PREBUILT_FRONTEND, and a push that touches what the bundle is
# built from builds it here on its own, so the module's toolchain and its build
# are tried on a fresh runner before a release is.
on:
  workflow_call:
  push:
    paths:
      - frontend/**
      - crates/remotex-rdp-graphics/**
      - .github/workflows/frontend-dist.yml

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install the WebAssembly modules' toolchains
        run: |
          (cd frontend/wasm/egfx && rustup toolchain install)
          (cd frontend/wasm/flac && rustup toolchain install)
          (cd frontend/wasm/vnc && rustup toolchain install)

      - name: Build frontend
        run: cd frontend && bun install --frozen-lockfile && bun run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
