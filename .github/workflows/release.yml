name: Release remotex and remotex.app

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/andrewtheguy/remotex

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine and validate version
        id: version
        run: |
          # Real TOML parse + semver check, not grep/sed (see also packaging/build-tarball.sh).
          # Plain python3 (3.11+ for tomllib): uv is for local dev, not the CI runners.
          # `[workspace.package]`, not `[package]`: every member inherits that one
          # version, including the root package, so it is the only literal.
          VERSION=$(python3 -c '
          import re, sys, tomllib
          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["workspace"]["package"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              sys.exit(f"invalid version in Cargo.toml: {version!r}")
          print(version)
          ')
          TAG="v${VERSION}"
          echo "Release tag: ${TAG}"
          IS_PRERELEASE="false"
          [ "$GITHUB_REF_NAME" = "main" ] || IS_PRERELEASE="true"
          # The bare version (no leading v) is the tarball/container filename
          # component and the Dockerfile's VERSION build-arg.
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Abort if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists on remote. Bump the version in Cargo.toml first."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Clean up any leftover draft from a previous failed run with the same
          # version. A draft release doesn't create the git tag on the remote, so
          # a stale draft is the only thing that can collide here (real published
          # tags are caught by the step above).
          if gh release view "${{ steps.version.outputs.tag }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Deleting stale draft release ${{ steps.version.outputs.tag }}"
            gh release delete "${{ steps.version.outputs.tag }}" --yes
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            ${{ steps.version.outputs.is_prerelease == 'true' && '--prerelease' || '' }}

  # The frontend bundle is platform-agnostic — build it once here and reuse it
  # for every target tarball, rather than rebuilding on each matrix runner.
  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: cd frontend && bun install --frozen-lockfile && bun run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  build:
    needs: [prepare, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: these binaries set the glibc floor for
          # both the tarballs and the container images (packaging/Dockerfile runs
          # them on debian:trixie-slim, glibc 2.41), so the builder must not drift
          # under us into something newer than what can run them.
          - runner: ubuntu-24.04
            target-note: linux-x86_64
          - runner: ubuntu-24.04-arm
            target-note: linux-arm64
          - runner: macos-latest
            target-note: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release tarball (${{ matrix.target-note }})
        run: SKIP_FRONTEND_BUILD=1 bash packaging/build-tarball.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotex-${{ matrix.target-note }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # remotex.app: the macOS shell around the same client, shipped as a disk image
  # beside the tarballs.
  #
  # Nothing is compiled here. The gateway that goes in the bundle is taken out of
  # the tarball this workflow already published — the same binary a tarball user
  # runs, rather than a second build of it that could differ — and the client comes
  # from the one `frontend-dist` every other job uses.
  mac-viewer:
    needs: [prepare, frontend, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Download prebuilt frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download the macOS tarball
        uses: actions/download-artifact@v4
        with:
          name: remotex-macos-arm64
          path: tmp/tarball

      - name: Take the gateway out of it
        run: |
          mkdir -p tmp/unpacked target/release
          tar -xzf "tmp/tarball/remotex-${{ needs.prepare.outputs.version }}-macos-arm64.tar.gz" \
            -C tmp/unpacked --strip-components=1
          cp tmp/unpacked/bin/remotex target/release/remotex

      - name: Check and test the shell
        run: |
          cd apps/viewer
          bun install --frozen-lockfile
          bun run check
          bun test tests

      - name: Build remotex.app and its disk image
        run: cd apps/viewer && bun run dist

      - name: Verify the disk image
        run: |
          version="${{ needs.prepare.outputs.version }}"
          dmg="dist/remotex-viewer-${version}-macos-arm64-unsigned.dmg"
          mnt="$RUNNER_TEMP/viewer-dmg-mount"
          mkdir -p "$mnt" "$RUNNER_TEMP/viewer-installed"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          [ "$(readlink "$mnt/Applications")" = "/Applications" ] || {
            echo "::error::the viewer image has no /Applications symlink"
            exit 1
          }
          # Copied out and unmounted first, so everything below is checked after the
          # archive round-trip — which is where a lost execute bit would show up.
          /usr/bin/ditto "$mnt/remotex.app" \
            "$RUNNER_TEMP/viewer-installed/remotex.app"
          hdiutil detach "$mnt"
          app="$RUNNER_TEMP/viewer-installed/remotex.app"
          codesign --verify --deep --strict --verbose=2 "$app"

          # The version reached the bundle. Not `--version` on the executable: an
          # Electron binary has no such flag, and the plist is what macOS reads.
          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$app/Contents/Info.plist")
          [ "$got" = "$version" ] || {
            echo "::error::expected CFBundleShortVersionString ${version}, got ${got}"
            exit 1
          }

          # The gateway, because an app with only one of its two executables is not
          # an app: the client cannot serve itself and the gateway has no window.
          got=$("$app/Contents/Resources/remotex-gateway" --version)
          [ "$got" = "remotex ${version}" ] || {
            echo "::error::expected 'remotex ${version}', got '${got}'"
            exit 1
          }

          # And the client it shows. Without it the app has nothing but its own
          # launch screen, and says so.
          [ -f "$app/Contents/Resources/web/index.html" ] || {
            echo "::error::remotex.app is missing the SPA it shows"
            exit 1
          }
          # The shell's own two documents, which are the screen that explains a
          # gateway that would not start — so they must not depend on one.
          [ -f "$app/Contents/Resources/app.asar" ] || {
            echo "::error::remotex.app has no app.asar"
            exit 1
          }
          npx --yes @electron/asar list "$app/Contents/Resources/app.asar" \
            > "$RUNNER_TEMP/asar.txt"
          for needed in /dist/main.cjs /dist/client.cjs /dist/shell.cjs \
            /dist/shell/launch.html /dist/shell/config.html; do
            grep -qx "$needed" "$RUNNER_TEMP/asar.txt" || {
              echo "::error::remotex.app is missing ${needed}"
              exit 1
            }
          done

          # Every local file the document names, resolved under the web root. The
          # `index.html` check above is satisfied by an `assets/` that lost the one
          # hashed script it asks for — and vite renames that file on every build, so
          # "the directory is there" is the weakest form of this question.
          python3 - "$app/Contents/Resources/web" <<'PY'
          import html.parser, pathlib, sys, urllib.parse

          root = pathlib.Path(sys.argv[1])

          class Refs(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []

              def handle_starttag(self, tag, attrs):
                  for name, value in attrs:
                      if name in ("src", "href") and value:
                          self.refs.append(value)

          parser = Refs()
          parser.feed((root / "index.html").read_text(encoding="utf-8"))

          missing = []
          checked = 0
          for ref in parser.refs:
              parsed = urllib.parse.urlparse(ref)
              # Somebody else's to serve (a scheme or a host), or not a file at all
              # (a bare `#fragment`): either way not this bundle's to carry.
              if parsed.scheme or parsed.netloc or not parsed.path:
                  continue
              checked += 1
              # Resolved against the web root. Vite emits `./assets/…` and index.html
              # sits at that root, so document-relative and root-relative are the same
              # thing here; `lstrip` keeps an absolute `/assets/…` working too.
              if not (root / urllib.parse.unquote(parsed.path).lstrip("/")).is_file():
                  missing.append(ref)

          if missing:
              print("::error::remotex.app references files it does not ship: " + ", ".join(missing))
              sys.exit(1)
          if not checked:
              # A document naming nothing is a build that emitted no script, which
              # would otherwise pass every check above and show a blank window.
              print("::error::remotex.app ships an index.html that references nothing")
              sys.exit(1)
          print(f"index.html references {checked} bundled file(s), all present")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotex-viewer-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  release:
    needs: [prepare, build, mac-viewer]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Both globs, not `artifacts/*`: `merge-multiple` also drops the
        # frontend-dist artifact's files in here, and those are build input, not
        # release assets. The .dmg is remotex.app.
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            artifacts/*.tar.gz artifacts/*.dmg --clobber

      - name: Publish release (remove draft, creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false

  # Container images, built only once the release is published so a pushed image
  # tag always corresponds to a real release. Nothing is compiled here: each
  # arch's image is the published tarball for that arch unpacked into the build
  # context, so it carries the exact binary users download plus the one
  # platform-agnostic frontend bundle from the `frontend` job.
  #
  # Each arch builds on its own native runner — no QEMU, no cross-compilation —
  # and plain `docker` (rather than buildx) because there is nothing to
  # cross-build and it lets the image be smoke-tested before it is pushed.
  #
  # These runners need no pinning (unlike the tarball builds above): the runner
  # only unpacks a tarball and drives docker, so all that matters is its arch —
  # the glibc that has to line up is the *base image*'s against the binary's.
  #
  # The image is the gateway alone. Nothing from `mac-viewer` goes into it: the app
  # is a macOS bundle shipped as a disk image and never in a container. Its only
  # relation to this job is that both hang off the same published release.
  docker:
    needs: [prepare, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            target-note: linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            target-note: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the release tarball (${{ matrix.target-note }})
        uses: actions/download-artifact@v4
        with:
          name: remotex-${{ matrix.target-note }}
          path: tmp/tarball

      - name: Unpack the tarball into the build context
        run: |
          mkdir -p tmp/docker-context
          # --strip-components=1 drops the remotex-<version>/ wrapper so the
          # context root holds bin/ and share/ as packaging/Dockerfile expects.
          tar -xzf "tmp/tarball/remotex-${{ needs.prepare.outputs.version }}-${{ matrix.target-note }}.tar.gz" \
            -C tmp/docker-context --strip-components=1
          ls -la tmp/docker-context tmp/docker-context/bin

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        run: |
          docker build \
            --file packaging/Dockerfile \
            --build-arg "VERSION=${{ needs.prepare.outputs.version }}" \
            --tag "${GHCR_IMAGE}:${IMAGE_TAG}" \
            tmp/docker-context

      - name: Smoke test the image
        run: |
          # Proves the release binary actually runs on this base image (a glibc
          # mismatch would only ever surface here) and that the image contents
          # match the release being published.
          got=$(docker run --rm "${GHCR_IMAGE}:${IMAGE_TAG}" --version)
          echo "image reports: ${got}"
          [ "$got" = "remotex ${{ needs.prepare.outputs.version }}" ] || {
            echo "::error::expected 'remotex ${{ needs.prepare.outputs.version }}'"
            exit 1
          }
          # The frontend has to be where the server looks for it by default.
          docker run --rm --entrypoint sh "${GHCR_IMAGE}:${IMAGE_TAG}" \
            -c 'test -f /opt/remotex/current/share/remotex/web/index.html'

      - name: Push image
        run: docker push "${GHCR_IMAGE}:${IMAGE_TAG}"

  # The per-arch tags above are plumbing; this is the tag users pull.
  docker-manifest:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push the multi-arch manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker manifest create "${GHCR_IMAGE}:${TAG}" \
            "${GHCR_IMAGE}:${TAG}-amd64" \
            "${GHCR_IMAGE}:${TAG}-arm64"
          docker manifest push "${GHCR_IMAGE}:${TAG}"

      # A prerelease is never `latest` — it is built off a non-main branch.
      - name: Point latest at this release
        if: needs.prepare.outputs.is_prerelease == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker manifest create "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:${TAG}-amd64" \
            "${GHCR_IMAGE}:${TAG}-arm64"
          docker manifest push "${GHCR_IMAGE}:latest"
