# The `native-vp9` feature, on by default, is screen-vp9's experimental VP9
# encoder in Rust, whose kernels on amd64 are AVX2, which that target's
# baseline lacks, and which refuses to build without them. Cargo cannot set a
# flag by feature, so every amd64 build here is AVX2: `RUSTFLAGS` and
# `RUSTDOCFLAGS` in the environment replace these, which with the feature off
# is the build for a machine without AVX2 (packaging/README.md, "x86-64 CPU
# compatibility").
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-feature=+avx2"]
rustdocflags = ["-C", "target-feature=+avx2"]
