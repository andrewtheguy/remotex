# The `native-vp9` feature, on by default, is screen-vp9's alpha VP9
# encoder in Rust, which on amd64 is built for x86-64-v3 (AVX2, BMI1 and BMI2,
# LZCNT, MOVBE, FMA: Haswell and Excavator on), above that target's baseline,
# and which refuses to build under it. Cargo cannot set a flag by feature, so
# every amd64 build here is x86-64-v3: `RUSTFLAGS` and `RUSTDOCFLAGS` in the
# environment replace these, which with the feature off is the build for a
# machine under that level (packaging/README.md, "x86-64 CPU compatibility").
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]
rustdocflags = ["-C", "target-cpu=x86-64-v3"]
