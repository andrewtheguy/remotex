# Workspace-wide cargo configuration.

[env]
# The macOS floor for the agent (crates/rxa-agent), and load-bearing for more
# than documentation.
#
# `screencapturekit` builds a Swift bridge with `swift build --triple
# arm64-apple-macosx` — no OS version on the triple. Without a deployment target
# Swift assumes an ancient one and links the *back-deployment* Swift runtime as
# `@rpath/libswift_Concurrency.dylib`. Nothing then adds a matching runpath, so
# the agent builds clean and dies at startup with:
#
#   dyld: Library not loaded: @rpath/libswift_Concurrency.dylib
#
# Setting the target makes Swift link the OS copies at absolute
# `/usr/lib/swift/…` paths instead, which is the actual fix rather than papering
# over it with an extra runpath.
#
# 15.4 for `NSPasteboard.accessBehavior`, which the clipboard watcher reports in
# the menu bar (see `crates/rxa-agent/src/pasteboard.rs`). Everything else here
# is far older — ScreenCaptureKit's dirty rects and `CGEvent` injection — so this
# one property is the whole reason for the floor. Keep it in step with `LSMinimumSystemVersion` in
# `packaging/macos/Info.plist`; the plist is what stops the app launching on an
# older Mac, this is what lets it compile against the newer SDK. Ignored on
# Linux, where the gateway is built.
#
# `force` so a stale value inherited from the environment cannot quietly change
# how the Swift bridge is linked.
MACOSX_DEPLOYMENT_TARGET = { value = "15.4", force = true }
