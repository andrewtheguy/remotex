# The gateway is the workspace root package; the macOS agent and the protocol
# crate it shares with the gateway live under crates/ (see
# docs/mac-agent-architecture.md).
#
# `default-members` deliberately omits rxa-agent: it only compiles on macOS, so
# a bare `cargo build` / `cargo clippy -- -D warnings` / `cargo test` on Linux
# must never reach for it. Build it explicitly with `-p rxa-agent` on a Mac.
#
# One version for the whole workspace: the gateway, the agent and the protocol
# crate they share all ship together, and a release names them from the same
# number. `[workspace.package]` below is the only literal `version` in the tree
# — every member inherits it with `version.workspace = true`.
#
# Note for anyone editing this file: frontend/vite.config.ts regexes the *first*
# line matching `^version = "…"` out of this manifest to stamp the login screen,
# so that line must stay the workspace version. `version.workspace = true` does
# not match the regex (the `.` after `version` breaks it), which is what keeps
# the members from shadowing it.
[workspace]
members = [".", "crates/rxa-proto", "crates/rxa-agent"]
default-members = [".", "crates/rxa-proto"]
resolver = "3"

[workspace.package]
version = "0.0.57"

[package]
name = "remotex"
version.workspace = true
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serves the built frontend from disk (see src/server.rs). Assets are no longer
# embedded in the binary — they ship alongside it under share/remotex/web.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
toml = "1"
# Cursor shapes only, since tiles moved to WebP: `encode_cursor_png` in
# src/protocol.rs. A shape is a few hundred bytes on the JSON control channel, and
# the macOS agent's arrive already PNG-encoded from AppKit, which cannot write WebP.
png = "0.18"
# WebP, the codec that replaced PNG and JPEG on the tile path (see src/protocol.rs). Not pure
# Rust: libwebp-sys compiles vendored libwebp C with `cc`. That is not a new class
# of requirement here — `ring` and `libz-sys` already do the same on every runner
# — and it costs nothing at runtime, because there is no cross-compilation
# (packaging/build-tarball.sh is a native `cargo build --release` per runner) and
# packaging/Dockerfile only COPYs the finished binary in.
#
# `default-features = false` drops its `img` feature, which would otherwise pull
# the whole `image` crate in for a convenience constructor we do not use.
webp = { version = "0.3.1", default-features = false }
# A direct dependency only to turn on libwebp's x86 SIMD. `webp` does not re-export
# its sys crate's features, and cargo unifies features across the graph, so naming
# libwebp-sys here is what reaches them.
#
# This makes the x86_64 build **x86-64-v3**, deliberately. libwebp-sys applies
# `-msse4.1`/`-mavx2` to its whole `cc::Build` rather than per-file
# (`setup_build` in its build.rs), so the objects are not runtime-dispatched: the
# binary requires those instructions. Every machine this runs on is Coffee Lake or
# newer (SSE4.1, AVX2, FMA, BMI2; no AVX-512), and this is a personal project, so
# the portability the default gives up buys real encode time back on the one
# codec that sits on the engine's hot path. arm64 needs nothing here — `neon` is
# already on by default.
libwebp-sys = { version = "0.9", features = ["sse41", "avx2"] }
# Remote audio: resample redirected PCM and encode bare Opus packets.
#
# `opus` binds libopus through audiopus_sys, which builds it with cmake. C again,
# and again not a new class of requirement — but unlike libwebp it *prefers a
# system library*: on Linux/GNU audiopus_sys probes pkg-config first, which would
# link libopus dynamically and leave the release binary needing libopus0 inside
# packaging/Dockerfile's debian:trixie-slim, which does not ship it. So
# packaging/build-tarball.sh sets LIBOPUS_STATIC/LIBOPUS_NO_PKG to force the
# vendored static build on every runner.
opus = "0.3"
# There is deliberately no container. Opus packets travel as audio frames on the
# desktop WebSocket, which already delimits them, and the browser hands them
# straight to a WebCodecs decoder — so an Ogg dependency would buy framing that is
# already there. `OpusHead` is still built by hand in src/opus_stream.rs, because a
# decoder needs it wherever it arrives from.
# 44100 -> 48000, because libopus accepts only 8/12/16/24/48 kHz and RDP offers
# no 48 kHz format. Pure Rust, and it resamples deinterleaved channels — which is
# the point: the naive interleaved interpolation blends left into right.
rubato = "4"
# Content hashing on the tile path: which pixels changed, and whether a payload
# has been sent before. Not a checksum for integrity, so it is not cryptographic
# — but it is 64-bit rather than 32, because a collision here means permanently
# wrong pixels rather than a retry. xxh3 over blake2/sha2 because this runs on
# every tile of every frame. Pure Rust, which is a nice property but not the
# reason it was chosen: `ring` (via rustls and snow) and `libz-sys` (via flate2
# and png) already compile C on every runner, so a C dependency here would have
# cost nothing new either.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Cursor shapes ride the JSON control channel as base64 PNG (see
# src/protocol.rs) — small and rare enough not to warrant a binary frame kind.
base64 = "0.22"
# Session-slot claim tokens (see src/session.rs) and auth session tokens
# (see src/auth.rs).
uuid = { version = "1", features = ["v4"] }
# Web login: the site_passwd credential is username:bcrypt_hash,
# verified on /api/auth/login (see src/auth.rs).
bcrypt = "0.19"
# Hidden password prompt for the `gen-passwd` helper subcommand.
rpassword = "7"
# Classic VNC authentication (src/vnc.rs): DES over the RFB challenge.
des = "0.8"
# Apple's DH authentication for VNC (src/vnc.rs), which is what names the user
# to a Mac: modular exponentiation over the server's prime, MD5 of the shared
# secret as an AES-128 key, and random bytes for the private key and the
# credential blob's filler. All four are already in the tree behind ironrdp and
# rustls, so this costs no new dependency.
num-bigint = "0.4"
md-5 = "0.11"
aes = "0.9"
rand = "0.10"
# zlib for RFB's Extended Clipboard, whose Provide payload is deflated
# (src/vnc_clipboard.rs). Already in the tree behind `png`, so this costs no
# new dependency.
flate2 = "1"
# Tuned TCP keepalive on every engine socket (src/engine.rs), so a remote host
# that is switched off — no FIN, no RST, just silence — is noticed in seconds
# rather than the kernel default's couple of hours. Already in the tree behind
# tokio, so this costs no new dependency. The `all` feature is not optional
# decoration: `with_retries`, the `tcp_keepalive_*` getters the test reads back,
# and Linux's `TCP_USER_TIMEOUT` all live behind it.
socket2 = { version = "0.6", features = ["all"] }

# The wire protocol shared with the macOS agent (src/rxa.rs, crates/rxa-agent).
# In-repo so the two halves cannot drift — see docs/mac-agent-architecture.md.
rxa-proto = { path = "crates/rxa-proto" }

# Server-side RDP engine (see docs/architecture.md). `dvc`/`displaycontrol`/`svc`
# expose the Display Control Virtual Channel used for client-driven resize;
# `cliprdr` is the MS-RDPECLIP static channel behind the clipboard bridge
# (see src/rdp_clipboard.rs), and `rdpsnd` is MS-RDPEA behind remote audio
# (see src/rdp_audio.rs). `rdpdr` is MS-RDPEFS, which
# remote audio needs registered even though nothing is ever redirected through
# it — see the Rdpdr registration in src/rdp.rs for why.
ironrdp = { version = "0.17", features = ["cliprdr", "connector", "session", "graphics", "dvc", "displaycontrol", "svc", "rdpsnd", "rdpdr"] }
ironrdp-tokio = { version = "0.10", features = ["reqwest-rustls-ring"] }
ironrdp-tls = { version = "0.2", features = ["rustls-ring"] }
# Direct dep so we can install the ring CryptoProvider as the process default
# before any TLS handshake (ironrdp-tls uses rustls with no bundled provider).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
# The codec the agent used for photographic tiles before WebP. A dev-dependency
# rather than gone, because `webp_cost_against_png_cost` measures against it: the
# reason JPEG was dropped is a ratio, and a ratio nobody can re-run is an anecdote.
jpeg-encoder = { version = "0.7", features = ["simd"] }
# `tokio::time::pause()` for the rxa engine's reconnect-backoff tests: waiting
# out a real 1-second backoff in a unit test is a second of nothing.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
