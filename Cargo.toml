# The gateway is the only package here. `serve` is the deployable browser gateway;
# `tui` is the feature-gated local multi-instance control plane;
# `serve-embedded` is its hidden per-instance worker. Every shape serves the same
# SPA and uses the same protocol implementation.
#
# One version for the whole workspace. `[workspace.package]` below is the only
# literal `version` in the tree — the root package inherits it with
# `version.workspace = true`.
#
# Note for anyone editing this file: frontend/vite.config.ts regexes the *first*
# line matching `^version = "…"` out of this manifest to stamp the login screen,
# so that line must stay the workspace version. `version.workspace = true` does
# not match the regex (the `.` after `version` breaks it), which is what keeps
# the root package from shadowing it.
[workspace]
resolver = "3"

[workspace.package]
version = "0.0.262-beta.1"

[package]
name = "remotex"
version.workspace = true
edition = "2024"

[features]
# Native builds include the local TUI control plane. Container artifacts
# explicitly disable default features: a remotely deployed gateway must not
# expose process supervision or its private worker surface. They turn `airplay`
# back on, so every released artifact carries the Mac's AirPlay speaker.
default = ["embedded-gateway", "airplay"]
embedded-gateway = ["dep:crossterm", "dep:libc"]
# A Mac's sound, received as an AirPlay 1 speaker (src/airplay/). Without it, the
# config refuses `[airplay]` and `audio` on a Mac.
airplay = ["dep:alac", "dep:mdns-sd", "dep:gethostname"]
# Apple High Performance's media stream (src/vnc_apple_media.rs, src/aac_eld.rs):
# the Mac's picture as HEVC and its sound as AAC-ELD, both over SRTP, which a
# target turns on with `subtype = "ard-high-performance"`. The two decoders are
# the feature: libde265 (LGPL, linked statically) and Fraunhofer's AAC-ELD
# decoder, whose licence is not OSI-approved. So it is off by default and in no
# release artifact; an operator builds
# `cargo build --release --features apple-hp-media`, and any other build refuses
# that subtype.
apple-hp-media = ["dep:de265-sys", "dep:aac"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
# `fs` for the one file read per request, `[branding].logo`; nothing else here
# touches the filesystem asynchronously.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The built frontend, compiled into the binary (src/assets.rs): build.rs puts the
# bundle in Cargo's OUT_DIR and the gateway is one file, with no web root beside
# it to find, configure or get wrong. `debug-embed` so a debug build is the same
# one file — the crate would otherwise read the folder from disk at run time in
# debug, which is a second serving path. `interpolate-folder-path` lets the derive
# read Cargo's private output. `mime-guess` names each file's content type from
# its extension.
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path", "mime-guess"] }
# `ServiceExt::oneshot` in the router tests, which drive the router without a
# socket.
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
libc = { version = "0.2", optional = true }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
# Refcounted buffers for the audio path: a wave buffer is handed to the bridge
# once and every hop after it — the broadcast queue, the passthrough packets —
# clones a pointer instead of 32 KB. Already in the tree through axum.
bytes = "1"
toml = "1"
# Cursor shapes, which ride the JSON control channel as base64 PNG
# (`encode_png` in src/protocol.rs).
png = "0.18"
# SQLite, for `[meter]`: the browser sockets' throughput per timeframe, which the page
# reads back through `GET /api/throughput` (src/throughput.rs). `bundled` compiles
# SQLite's one C file with `cc` — no system library to find.
rusqlite = { version = "0.40", features = ["bundled"] }
# libvpx, for VP9 — the video codec every desktop is streamed with (src/vp9.rs). VP9 is BSD-3-Clause with a patent grant, so every browser
# build decodes it, proprietary-codec-free ones included.
#
# Its sys crate downloads a prebuilt static archive and compiles no C: the same bargain
# `opus-prebuilt` below strikes, and for the same reason — libvpx's own build is
# `configure` + `make` and wants an assembler, which is a thing no check of this gateway
# should have to have. Do not restore a source build, a vcpkg dependency, or bindgen:
# the bindings are committed in that repository.
#
# Encoder and decoder are both in the archive; this gateway only encodes. libvpx
# asserts nothing — it returns error codes — which is why `src/vp9.rs` can be a
# plain `?` path under `panic = "abort"`.
vpx-sys = { package = "libvpx-prebuilt-sys", git = "https://github.com/andrewtheguy/libvpx-prebuilt", tag = "v1.16.0-20260924182850-e78d74f" }
# The RGB→YUV conversion in front of that encoder (`Yuv::read_rgb` in src/video.rs),
# for both chroma samplings. Pure Rust with AVX2 and NEON paths chosen at run time —
# no C, no assembler, the same bargain as above — and three times the speed of the
# scalar loop it replaced, which on a six-core host was two fifths of a 1080p encode.
yuv = "0.8"
# libde265, for High Performance's HEVC screen video (src/vnc_apple_media.rs),
# behind the `apple-hp-media` feature above: the Mac's picture over its media
# stream, decoded here and re-encoded as VP9. The same bargain as libvpx above —
# its sys crate downloads a prebuilt static archive and compiles no C++ — and a
# decoder only. libde265 is LGPL-3.0-or-later, linked statically; the prebuilt
# repository's README says what that obliges.
de265-sys = { package = "libde265-prebuilt-sys", git = "https://github.com/andrewtheguy/libde265-prebuilt", tag = "v1.1.3-20260925063936-02ceb6b", optional = true }
# AAC-ELD, for the same stream's sound, behind the same feature. Fraunhofer's
# decoder, but the Rust one: AOSP ships a pure-Rust port of it as
# `platform/external/aac`, `rust/`, which is not published on crates.io. The
# repository below is that crate cut down to the one thing asked of it here — ER
# AAC ELD, mono or stereo, no SBR, raw access units — and checked sample for
# sample against the unmodified decoder. It needs nothing prebuilt: no static
# archive, no sys crate, no C++ toolchain. The licence is unchanged by the
# rewrite and by the cutting down, and still not OSI-approved.
aac = { git = "https://github.com/andrewtheguy/fdk-aac-rust", tag = "v0.2.0", optional = true }
# Remote audio: resample redirected PCM and encode bare Opus packets.
#
# `opus-prebuilt` is a fork of the `opus` 0.3.1 crate that links libopus from a
# prebuilt static archive its sys crate downloads, instead of compiling the
# vendored C through cmake. That deletes the whole LIBOPUS_STATIC/LIBOPUS_NO_PKG/
# CMAKE_POLICY_VERSION_MINIMUM dance the packaging scripts used to carry: there is
# no C build on this path any more, and nothing links a system `libopus.dylib`, so
# the binary is self-contained on every runner without any env coaxing. The lib is
# still named `opus`, so every `use opus::…` in src/opus_stream.rs is untouched.
opus = { package = "opus-prebuilt", git = "https://github.com/andrewtheguy/libopus-prebuilt", tag = "v1.6.1-20260906161304-8dd83e8" }
# There is deliberately no container. Opus packets travel as audio frames on the
# dedicated audio WebSocket, which already delimits them, and the browser hands
# them straight to a WebCodecs decoder — so an Ogg dependency would buy framing
# that is already there. `OpusHead` is still built by hand in src/opus_stream.rs,
# because a decoder needs it wherever it arrives from.
#
# The other audio option (`audio_codec = "pcm"`, src/pcm_stream.rs) needs no
# dependency at all, which is most of its point: passthrough copies the remote's
# bytes to the socket, so there is no encoder to link and no codec licence to
# carry. A second *encoder* was tried here and removed — see the pcm_stream module
# doc for why compressing harder was the wrong axis.
# FLAC, which is how wlshare carries a desktop's sound on the RFB connection
# (src/vnc_audio.rs): lossless, so the Opus encode above stays the only lossy
# step. symphonia's decoder, pure Rust, and only the FLAC bundle of it —
# `symphonia-core` for the decoder trait and the packet it takes. Each frame
# decodes on its own, with the stream header built here, so none of symphonia's
# demuxing is used.
symphonia-bundle-flac = "0.6"
symphonia-core = "0.6"
# 44100 -> 48000, because libopus accepts only 8/12/16/24/48 kHz and RDP offers
# no 48 kHz format. Pure Rust, and it resamples deinterleaved channels — which is
# the point: the naive interleaved interpolation blends left into right.
rubato = "4"
# A stable hash of the AirPlay speaker's identity (src/airplay/mod.rs).
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Cursor shapes ride the JSON control channel as base64 PNG (see
# src/protocol.rs) — small and rare enough not to warrant a binary frame kind.
base64 = "0.22"
# Session-slot claim tokens (see src/session.rs) and auth session tokens
# (see src/auth.rs).
uuid = { version = "1", features = ["v4"] }
# Web login: the site_passwd credential is username:bcrypt_hash,
# verified on /api/auth/login (see src/auth.rs).
bcrypt = "0.19"
# Hidden password prompt for the `gen-passwd` helper subcommand.
rpassword = "7"
# Classic VNC authentication (src/vnc.rs): DES over the RFB challenge.
des = "0.8"
# Apple's DH authentication for VNC (src/vnc.rs), which is what names the user
# to a Mac: modular exponentiation over the server's prime, MD5 of the shared
# secret as an AES-128 key, and random bytes for the private key and the
# credential blob's filler. Four direct dependencies for one authentication
# scheme, each named here because the VNC path uses it directly, whatever else in
# the tree happens to pull it in too.
num-bigint = "0.4"
md-5 = "0.11"
aes = "0.9"
rand = "0.10"
# Integrity trailer on Apple's record layer (src/vnc_record.rs), which the
# `ard-virtual-display` and `ard-high-performance` subtypes speak: plain SHA-1 over the record's sequence
# number and plaintext, not HMAC. The VNC path's own. CBC is *not* a dependency: the `cbc` crate in the tree
# is on `cipher` 0.4 while `aes` above is on 0.5, and chaining eight lines by hand
# keeps "one context per direction, never reset" a visible field rather than a
# library invariant.
sha1 = "0.11"
# zlib for RFB's Extended Clipboard, whose Provide payload is deflated
# (src/vnc_clipboard.rs). Already in the tree behind `png`, so this costs no new
# dependency.
#
# The backend is flate2's default, the pure-Rust miniz_oxide; nothing in the tree
# turns on C zlib. A dependency that did would switch every flate2 user over, and
# the two differ in one way this repo has met: a sync flush against an
# already-flushed stream emits an empty stored block on miniz_oxide where C zlib
# suppresses it. See `deflate_chunk` in src/vnc_encodings.rs; the production
# deflate and inflate loops are correct under either.
flate2 = "1"
# Tuned TCP keepalive on every engine socket (src/engine.rs), so a remote host
# that is switched off — no FIN, no RST, just silence — is noticed in seconds
# rather than the kernel default's couple of hours. Already in the tree behind
# tokio, so this costs no new dependency. The `all` feature is not optional
# decoration: `with_retries`, the `tcp_keepalive_*` getters the test reads back,
# and Linux's `TCP_USER_TIMEOUT` all live behind it.
socket2 = { version = "0.6", features = ["all"] }

# Server-side RDP engine (see docs/architecture.md): the gateway's own headless
# client in src/rdp_client/, protocol and all — every PDU is encoded and decoded in
# src/rdp_client/proto/ against [MS-RDPBCGR], so nothing below is an RDP library.
# Pure Rust apart from `ring` and zlib, so the build needs no cmake, pkg-config,
# OpenSSL or libclang.
#
# TLS is rustls with `ring`, and rustls needs that provider installed as the process
# default before the first handshake: `tokio-rustls` is a direct dependency both for
# the session's own TLS and so src/rdp_client can install it.
#
# `tls12` is not optional: with default features off rustls speaks TLS 1.3 alone, and
# Windows 10 has no TLS 1.3 — it answers a 1.3-only ClientHello with a reset.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# CredSSP and NTLM for the gateway's own RDP stack (src/rdp_client/proto/credssp.rs).
# Network Level Authentication is not optional on a current Windows host, and NTLM is
# the one mechanism a user name and a password can drive — so this is the part of the
# connection sequence that is not worth writing twice. It arrived in the tree as
# IronRDP's own CredSSP dependency, and stayed when IronRDP left.
#
# No features. The ones on offer — `aws-lc-rs`/`ring`, `network_client`, `scard` —
# reach sspi's *own* TLS and its Kerberos network client, neither of which a CredSSP
# exchange over an already-open TLS session touches. The TLS here is rustls, below.
sspi = { version = "0.21", default-features = false }
# RealVNC's RSA-AES security types for VNC (src/vnc_rsa_aes.rs), which is how a
# plain `vnc` target names a user to a server that is not a Mac — wayvnc with
# `enable_auth` offers nothing else this client speaks. A fresh RSA key pair per
# session and PKCS#1 v1.5 around the two randoms; SHA-256 beside the `sha1` above
# for the 256-bit type's key derivation; and AES-EAX over `aes` above for every
# byte after. The release-candidate `rsa` is the line on `rand_core` 0.10 and
# `digest` 0.11, which are the versions already in the tree; 0.9 would bring a
# second of each. No `encoding`: keys here are raw big-endian numbers, never
# PEM or DER.
rsa = { version = "0.10.0-rc.18", default-features = false }
eax = "0.6"
sha2 = "0.11"
# SRTP's and SRTCP's HMAC-SHA1-80 tags on the High Performance media stream
# (src/vnc_apple_media.rs), over the `sha1` above.
hmac = "0.13"
# A Mac's sound, received as an AirPlay 1 speaker (src/airplay/): the Mac streams
# Apple Lossless, which this pure-Rust decoder takes packet by packet from the
# SDP's own parameters, and finds the speaker by DNS-SD, which `mdns-sd` answers
# and announces from inside the process — no avahi or Bonjour on the host, and no
# async runtime of its own. The RSA, AES and MD5 the protocol asks for are the
# crates above. The host's name, with the branding, is what keeps two gateways'
# speakers distinct.
alac = { version = "0.5", optional = true }
mdns-sd = { version = "0.21", optional = true }
gethostname = { version = "1", optional = true }

[build-dependencies]
anyhow = "1"

# The global allocator on every Unix build (src/main.rs): glibc's per-thread arenas
# kept freed session memory, and the gateway grew with every session. Windows' heap
# has no such arenas and keeps the system allocator.
#
# Unprefixed, so jemalloc is `malloc` itself and not only Rust's allocator. Most of a
# session's memory is libvpx's and opus's, and they call `malloc`: with Rust alone on
# jemalloc the gateway grew faster than it did on glibc.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = "0.7"
tikv-jemalloc-sys = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"] }

[[test]]
name = "embedded_gateway_e2e"
required-features = ["embedded-gateway"]

[[test]]
name = "tui_control_plane_e2e"
required-features = ["embedded-gateway"]

[dev-dependencies]
# Apple Lossless packets for the AirPlay receiver's test, made by Apple's own
# encoder ported to Rust, which shares nothing with the decoder above.
alac-encoder = "0.3"
# FLAC frames for the audio decoder's tests, made the way wlshare makes them and
# by an encoder that shares nothing with symphonia.
flacenc = { version = "0.5", default-features = false }
tokio-tungstenite = "0.29"
# Scratch directories for the tests that need a real path on disk: an instance
# directory to serve from, and the ones behind `Instance::origin_label`, which
# canonicalizes what it is given and so cannot be tested against a name that does
# not exist.
tempfile = "3"
# The scripted Apple Screen Sharing server in tests/protocol_e2e.rs plays the
# *server* side of Apple's DH authentication and wraps the record layer's key,
# neither of which the gateway does. Written against the specification rather
# than by calling src/vnc.rs, so a mistake in one cannot be agreed with by the
# other. All three are already direct dependencies of the gateway.
num-bigint = "0.4"
md-5 = "0.11"
aes = "0.9"
# `tokio::time::pause()` for the session heartbeat and reattach-grace tests
# (src/session.rs, src/ws.rs): waiting out a real timeout in a unit test is a
# stretch of doing nothing.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
