# The gateway is the workspace root package; the macOS agent and the protocol
# crate it shares with the gateway live under crates/ (see
# docs/mac-agent-architecture.md).
#
# `default-members` deliberately omits rxa-agent: it only compiles on macOS, so
# a bare `cargo build` / `cargo clippy -- -D warnings` / `cargo test` on Linux
# must never reach for it. Build it explicitly with `-p rxa-agent` on a Mac.
#
# One version for the whole workspace: the gateway, the agent and the protocol
# crate they share all ship together, and a release names them from the same
# number. `[workspace.package]` below is the only literal `version` in the tree
# — every member inherits it with `version.workspace = true`.
#
# Note for anyone editing this file: frontend/vite.config.ts regexes the *first*
# line matching `^version = "…"` out of this manifest to stamp the login screen,
# so that line must stay the workspace version. `version.workspace = true` does
# not match the regex (the `.` after `version` breaks it), which is what keeps
# the members from shadowing it.
[workspace]
members = [".", "crates/rxa-proto", "crates/rxa-agent"]
default-members = [".", "crates/rxa-proto"]
resolver = "3"

[workspace.package]
version = "0.0.25"

[package]
name = "remotex"
version.workspace = true
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serves the built frontend from disk (see src/server.rs). Assets are no longer
# embedded in the binary — they ship alongside it under share/remotex/web.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
toml = "1"
# Tile payload compression for the browser transport (see src/protocol.rs).
png = "0.18"
# Cursor shapes ride the JSON control channel as base64 PNG (see
# src/protocol.rs) — small and rare enough not to warrant a binary frame kind.
base64 = "0.22"
# Session-slot claim tokens (see src/session.rs) and auth session tokens
# (see src/auth.rs).
uuid = { version = "1", features = ["v4"] }
# Web login: the site_passwd credential is username:bcrypt_hash,
# verified on /api/auth/login (see src/auth.rs).
bcrypt = "0.19"
# Hidden password prompt for the `gen-passwd` helper subcommand.
rpassword = "7"
# Classic VNC authentication (src/vnc.rs): DES over the RFB challenge.
des = "0.8"
# zlib for RFB's Extended Clipboard, whose Provide payload is deflated
# (src/vnc_clipboard.rs). Already in the tree behind `png`, so this costs no
# new dependency.
flate2 = "1"

# The wire protocol shared with the macOS agent (src/rxa.rs, crates/rxa-agent).
# In-repo so the two halves cannot drift — see docs/mac-agent-architecture.md.
rxa-proto = { path = "crates/rxa-proto" }

# Server-side RDP engine (see docs/architecture.md). `dvc`/`displaycontrol`/`svc`
# expose the Display Control Virtual Channel used for client-driven resize;
# `cliprdr` is the MS-RDPECLIP static channel behind the clipboard bridge
# (see src/rdp_clipboard.rs).
ironrdp = { version = "0.17", features = ["cliprdr", "connector", "session", "graphics", "dvc", "displaycontrol", "svc"] }
ironrdp-tokio = { version = "0.10", features = ["reqwest-rustls-ring"] }
ironrdp-tls = { version = "0.2", features = ["rustls-ring"] }
# Direct dep so we can install the ring CryptoProvider as the process default
# before any TLS handshake (ironrdp-tls uses rustls with no bundled provider).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
# `tokio::time::pause()` for the rxa engine's reconnect-backoff tests: waiting
# out a real 1-second backoff in a unit test is a second of nothing.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
