# The gateway is the only package here. The macOS agent and the protocol crate it
# shared were removed (see docs/roadmap.md for the virtual-display utility idea
# that could one day revive its one kept feature), and so was the native macOS
# viewer that embedded Chromium by hand.
#
# `remotex.app` is back and is not in this workspace: it is `apps/viewer`, an
# Electron shell around the same SPA, built with bun and electron-builder. What it
# needs from this crate is a mode — `serve-embedded` (src/embedded.rs) — and the
# binary itself, which its bundle carries. See docs/macos-viewer.md.
#
# One version for the whole workspace. `[workspace.package]` below is the only
# literal `version` in the tree — the root package inherits it with
# `version.workspace = true`.
#
# Note for anyone editing this file: frontend/vite.config.ts regexes the *first*
# line matching `^version = "…"` out of this manifest to stamp the login screen,
# so that line must stay the workspace version. `version.workspace = true` does
# not match the regex (the `.` after `version` breaks it), which is what keeps
# the root package from shadowing it.
[workspace]
resolver = "3"

[workspace.package]
version = "0.0.123"

[package]
name = "remotex"
version.workspace = true
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serves the built frontend from disk (see src/server.rs). Assets are no longer
# embedded in the binary — they ship alongside it under share/remotex/web.
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
# Refcounted buffers for the audio path: a wave buffer is handed to the bridge
# once and every hop after it — the broadcast queue, the passthrough packets —
# clones a pointer instead of 32 KB. Already in the tree through axum.
bytes = "1"
toml = "1"
# Tiles and cursor shapes both. The RDP and VNC engines PNG-compress screen tiles
# (`Tile::from_rgb`), and VNC cursor shapes ride the JSON control channel as base64
# PNG. `encode_png` in src/protocol.rs is shared by both. Fast compression on the
# session's hot path.
png = "0.18"
# JPEG for the lossy tile path: a target with `render_type = "fixed-quality"`,
# `render_subtype = "jpeg"` encodes every tile at a fixed `render_quality` instead
# of lossless PNG (`Tile::from_rgb_jpeg` in src/protocol.rs). The format byte
# already distinguishes PNG from JPEG on the wire and the client decodes either,
# so this is a gateway-only encoder. `simd` because it runs on the session hot path.
jpeg-encoder = { version = "0.7", features = ["simd"] }
# WebP for the lossy tile path's `webp` subtype — ~30% fewer bytes than JPEG at a
# matched quality, decoded natively by the browser through `createImageBitmap`.
# Binds a statically-linked libwebp built by `cc`
# (not cmake) with the target's SIMD, so it costs no cmake and no new runtime dep.
webp = "0.3"
# libvpx, for VP9 — the video codec, for either streaming mode: the whole framebuffer
# under `render_type = "video"`, or moving regions under `render_motion_subtype =
# "stream"` (src/vp9.rs). VP9 is BSD-3-Clause with a patent grant, so every browser
# build decodes it, proprietary-codec-free ones included.
#
# Its sys crate downloads a prebuilt static archive and compiles no C: the same bargain
# `opus-prebuilt` below strikes, and for the same reason — libvpx's own build is
# `configure` + `make` and wants an assembler, which is a thing no check of this gateway
# should have to have. Do not restore a source build, a vcpkg dependency, or bindgen:
# the bindings are committed in that repository.
#
# Encoder and decoder are both in the archive; this gateway only encodes. libvpx
# asserts nothing — it returns error codes — which is why `src/vp9.rs` can be a
# plain `?` path under `panic = "abort"`.
vpx-sys = { package = "libvpx-prebuilt-sys", git = "https://github.com/andrewtheguy/libvpx-prebuilt", tag = "v1.16.0-20260804003457-6bca589" }
# Remote audio: resample redirected PCM and encode bare Opus packets.
#
# `opus-prebuilt` is a fork of the `opus` 0.3.1 crate that links libopus from a
# prebuilt static archive its sys crate downloads, instead of compiling the
# vendored C through cmake. That deletes the whole LIBOPUS_STATIC/LIBOPUS_NO_PKG/
# CMAKE_POLICY_VERSION_MINIMUM dance the packaging scripts used to carry: there is
# no C build on this path any more, and nothing links a system `libopus.dylib`, so
# the binary is self-contained on every runner without any env coaxing. The lib is
# still named `opus`, so every `use opus::…` in src/opus_stream.rs is untouched.
opus = { package = "opus-prebuilt", git = "https://github.com/andrewtheguy/libopus-prebuilt", tag = "v1.6.1-20260731073637-74aab76" }
# There is deliberately no container. Opus packets travel as audio frames on the
# dedicated audio WebSocket, which already delimits them, and the browser hands
# them straight to a WebCodecs decoder — so an Ogg dependency would buy framing
# that is already there. `OpusHead` is still built by hand in src/opus_stream.rs,
# because a decoder needs it wherever it arrives from.
#
# The other audio option (`audio_codec = "pcm"`, src/pcm_stream.rs) needs no
# dependency at all, which is most of its point: passthrough copies the remote's
# bytes to the socket, so there is no encoder to link and no codec licence to
# carry. A second *encoder* was tried here and removed — see the pcm_stream module
# doc for why compressing harder was the wrong axis.
# 44100 -> 48000, because libopus accepts only 8/12/16/24/48 kHz and RDP offers
# no 48 kHz format. Pure Rust, and it resamples deinterleaved channels — which is
# the point: the naive interleaved interpolation blends left into right.
rubato = "4"
# Content hashing on the tile path: which pixels changed, and whether a payload
# has been sent before. Not a checksum for integrity, so it is not cryptographic
# — but it is 64-bit rather than 32, because a collision here means permanently
# wrong pixels rather than a retry. xxh3 over blake2/sha2 because this runs on
# every tile of every frame. Pure Rust, which is a nice property but not the
# reason it was chosen: the prebuilt FreeRDP and OpenSSL archives mean C is linked
# on every runner anyway, so a C dependency here would have cost nothing new
# either. (It used to say `libz-sys` too, which was true while ironrdp was in the
# tree and is not any more — see `flate2` below.)
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Cursor shapes ride the JSON control channel as base64 PNG (see
# src/protocol.rs) — small and rare enough not to warrant a binary frame kind.
base64 = "0.22"
# Session-slot claim tokens (see src/session.rs) and auth session tokens
# (see src/auth.rs).
uuid = { version = "1", features = ["v4"] }
# Web login: the site_passwd credential is username:bcrypt_hash,
# verified on /api/auth/login (see src/auth.rs).
bcrypt = "0.19"
# Hidden password prompt for the `gen-passwd` helper subcommand.
rpassword = "7"
# Classic VNC authentication (src/vnc.rs): DES over the RFB challenge.
des = "0.8"
# Apple's DH authentication for VNC (src/vnc.rs), which is what names the user
# to a Mac: modular exponentiation over the server's prime, MD5 of the shared
# secret as an AES-128 key, and random bytes for the private key and the
# credential blob's filler. Four direct dependencies for one authentication
# scheme, and they used to be free — ironrdp and rustls pulled all four in. That
# stopped being true when the RDP engine became FreeRDP, whose crypto is the
# OpenSSL compiled into its archives; they are the VNC path's own cost now.
num-bigint = "0.4"
md-5 = "0.11"
aes = "0.9"
rand = "0.10"
# Integrity trailer on Apple's record layer (src/vnc_record.rs), which the
# `ard-high-performance` subtype speaks: plain SHA-1 over the record's sequence
# number and plaintext, not HMAC. Also no longer free behind ironrdp, and also
# the VNC path's own. CBC is *not* a dependency: the `cbc` crate in the tree
# is on `cipher` 0.4 while `aes` above is on 0.5, and chaining eight lines by hand
# keeps "one context per direction, never reset" a visible field rather than a
# library invariant.
sha1 = "0.11"
# zlib for RFB's Extended Clipboard, whose Provide payload is deflated
# (src/vnc_clipboard.rs). Already in the tree behind `png`, so this costs no new
# dependency.
#
# **Pure Rust now, and that was not a choice made here.** ironrdp enabled flate2's
# C backend, so `libz-sys` was in the tree; dropping it for FreeRDP left flate2 on
# its default `miniz_oxide` and took `libz-sys` out entirely. Good news for the
# build — one fewer C library — but not a silent swap: a sync flush against an
# already-flushed stream emits an empty stored block on miniz_oxide where the C
# zlib suppresses it, which hung a test helper written to loop until a flush
# produced nothing. See `deflate_chunk` in src/vnc_encodings.rs. The production
# deflate loop was already written correctly and is unaffected.
flate2 = "1"
# Tuned TCP keepalive on every engine socket (src/engine.rs), so a remote host
# that is switched off — no FIN, no RST, just silence — is noticed in seconds
# rather than the kernel default's couple of hours. Already in the tree behind
# tokio, so this costs no new dependency. The `all` feature is not optional
# decoration: `with_retries`, the `tcp_keepalive_*` getters the test reads back,
# and Linux's `TCP_USER_TIMEOUT` all live behind it.
socket2 = { version = "0.6", features = ["all"] }

# Server-side RDP engine (see docs/architecture.md): a safe, headless RDP client
# over a **statically prebuilt FreeRDP 3**, in the same bargain `opus-prebuilt`
# and `libvpx-prebuilt` above already strike. Its `build.rs` downloads the
# archives for this target from that repository's latest release, verifies them
# and emits the link flags — so this build needs no cmake, no pkg-config, no
# OpenSSL installed and no libclang, and `packaging/build-tarball.sh` sets
# nothing for it.
#
# The tag pins the wrapper and its committed bindings; the *archives* come from
# whatever that repository's newest release is. Not a hole: the asset filename
# carries the FreeRDP version, so a release that moved to a different FreeRDP
# 404s naming it rather than handing back a library those bindings do not
# describe, and a rebuild of the same version is how a build fix arrives here.
#
# It replaced IronRDP, which was not stable enough against real Windows hosts.
# Two things came off the tree with it and are worth naming, because their
# absence changes what other dependencies are here for: `ironrdp-tls` brought
# rustls, whose `ring` is why `src/main.rs` had to install a CryptoProvider
# before any handshake — FreeRDP does its own TLS against the OpenSSL inside
# those archives, so that install is gone. And the RDP path no longer opens its
# own socket at all: FreeRDP owns it, and `src/engine.rs`'s keepalive policy is
# restated to it as settings rather than applied to a `TcpStream`.
#
# `num-bigint`, `md-5`, `aes`, `rand` and `sha1` above are *not* affected — the
# comments there say they came free behind ironrdp, which is no longer true, but
# every one of them is a direct dependency of the VNC path in its own right.
freerdp = { git = "https://github.com/andrewtheguy/libfreerdp-prebuilt", tag = "v3.30.0-20260807021630-3d1f4c8" }

[dev-dependencies]
tokio-tungstenite = "0.29"
# Scratch directories for the tests that need a real path on disk: an instance
# directory to serve from, and the ones behind `Instance::origin_label`, which
# canonicalizes what it is given and so cannot be tested against a name that does
# not exist.
tempfile = "3"
# The scripted Apple Screen Sharing server in tests/protocol_e2e.rs plays the
# *server* side of Apple's DH authentication and wraps the record layer's key,
# neither of which the gateway does. Written against the specification rather
# than by calling src/vnc.rs, so a mistake in one cannot be agreed with by the
# other. All three are already direct dependencies of the gateway.
num-bigint = "0.4"
md-5 = "0.11"
aes = "0.9"
# `tokio::time::pause()` for the session heartbeat and reattach-grace tests
# (src/session.rs, src/ws.rs): waiting out a real timeout in a unit test is a
# stretch of doing nothing.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"


