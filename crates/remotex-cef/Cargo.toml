[package]
name = "remotex-cef"
version.workspace = true
edition = "2024"
publish = false

# A static library with a C ABI, linked into the Swift app (see
# apps/remotex-viewer/Package.swift). Not a cdylib: there is one consumer, it
# lives in the same bundle, and a static link means no second thing to sign, to
# find at an `@rpath`, or to keep in step with the executable beside it.
[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Enter macOS's seatbelt before anything else runs. Off by default because the
# browser process must not: it passes a null `sandbox_info` and only says
# `no_sandbox = 0`. `remotex-cef-helper` turns this on for itself, which is what
# makes `run_helper_process` link `cef_sandbox` in the one binary that needs it.
sandbox = ["cef/sandbox"]

[dependencies]
# The engine. `default-features = false` drops `sandbox` and `build-util`:
# the bundle is assembled by packaging/macos-viewer/build-viewer-app.sh rather
# than by `bundle-cef-app`, and the sandbox is the helper binary's to enable.
cef = { version = "151.2", default-features = false }
# Reading the request out of a message-router query and the state object back
# into one is all JSON; the events themselves are the client's shapes, not this
# crate's, so nothing here is typed beyond "a string that came from the page".
serde_json = "1"
# `set_as_child` takes an `NSView *` straight from Swift, and the container's
# bounds have to be read to size the browser into it.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSView", "NSResponder"] }
objc2-foundation = "0.3"
