[package]
name = "rxa-agent"
version.workspace = true
edition = "2024"

# macOS only. Excluded from the workspace's `default-members`, so it is never
# built by a bare `cargo build` / `cargo clippy` / `cargo test` on Linux —
# build it explicitly on a Mac with `cargo build -p rxa-agent`.
[[bin]]
name = "remotex-agent"
path = "src/main.rs"

[dependencies]
rxa-proto = { path = "../rxa-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
file-rotate = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1"

# Screen capture. Chosen over objc2-screen-capture-kit because it exposes the
# `SCStreamFrameInfo.dirtyRects` attachment directly (`CMSampleBuffer::
# dirty_rects`), which the whole design leans on — see docs/architecture.md.
# It builds a small Swift bridge, which is why .cargo/config.toml pins
# MACOSX_DEPLOYMENT_TARGET: without it Swift links the back-deployment
# concurrency runtime and the agent dies at startup.
screencapturekit = "8"

# Tile codec. Same crate and the same settings the gateway uses, so a lossless
# tile from the agent is byte-comparable with one from the VNC engine — and one
# codec covers both branches of the per-tile classifier (see encode.rs), which is
# what retired `png` and `jpeg-encoder` from here.
#
# Not pure Rust: libwebp-sys compiles vendored libwebp C with `cc`. No new class of
# requirement for this crate — `ring`, via snow under rxa-proto, already does — and
# arm64 needs no feature flags for it, since libwebp-sys enables NEON by default.
webp = { version = "0.3.1", default-features = false }
# Deciding whether a strip's pixels changed at all, before paying to encode them
# (see capture.rs). Same choice and same reasoning as the gateway's.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Input injection (CGEvent*), the pointer shape (NSCursor) and the menu bar
# item (NSStatusItem and friends).
objc2 = "0.6"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
# Features here do not imply sibling features: NSStatusBarButton gets the type
# but none of NSButton's methods, so every superclass in a chain we call
# through has to be listed too.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSCursor",
    "NSImage",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSGraphics",
    "NSApplication",
    # NSApplicationActivationPolicy lives in NSRunningApplication's header, and
    # NSVariableStatusItemLength is a CGFloat, which needs the CF interop.
    "NSRunningApplication",
    "objc2-core-foundation",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSControl",
    "NSCell",
    "NSView",
    "NSResponder",
    "NSMenu",
    "NSMenuItem",
    # `Starting::pump_until` dequeues events by hand so the status item's menu works
    # while startup runs — see the argument there.
    "NSEvent",
    "NSPasteboard",
    "NSWorkspace",
    # The modal panels (src/panels.rs): Settings is a normal NSPanel, while
    # confirmations, errors and the private-key prompt are NSAlerts. NSWindow is
    # also used to focus the first field. NSText and NSFont come with the fields
    # themselves — the keys are monospaced so they can be compared character by
    # character against the gateway's config.
    "NSAlert",
    "NSPanel",
    "NSTextField",
    "NSText",
    "NSFont",
    "NSWindow",
    "NSPopUpButton",
    # NSColor is what makes the read-only public key look read-only: an
    # NSTextField built with `initWithFrame:` fills itself with
    # `textBackgroundColor` and reads as somewhere to type. It also gates
    # NSTextField's own `setBackgroundColor`.
    "NSColor",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSError",
    "NSURL",
    "NSDate",
    "NSTimer",
    "NSRunLoop",
] }
