[package]
name = "rxa-agent"
version.workspace = true
edition = "2024"

# macOS only. Excluded from the workspace's `default-members`, so it is never
# built by a bare `cargo build` / `cargo clippy` / `cargo test` on Linux —
# build it explicitly on a Mac with `cargo build -p rxa-agent`.
[[bin]]
name = "remotex-agent"
path = "src/main.rs"

[dependencies]
rxa-proto = { path = "../rxa-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
file-rotate = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1"

# Screen capture. Chosen over objc2-screen-capture-kit because it exposes the
# `SCStreamFrameInfo.dirtyRects` attachment directly (`CMSampleBuffer::
# dirty_rects`), which the whole design leans on — see docs/architecture.md.
# It builds a small Swift bridge, which is why .cargo/config.toml pins
# MACOSX_DEPLOYMENT_TARGET: without it Swift links the back-deployment
# concurrency runtime and the agent dies at startup.
screencapturekit = "8"

# Tile codecs. Same `png` version and Fast compression the gateway uses, so a
# PNG tile from the agent is byte-comparable with one from the VNC engine.
png = "0.18"
# Pure Rust, no C dependency; `simd` matters because this runs per tile on a
# Retina desktop.
jpeg-encoder = { version = "0.7", features = ["simd"] }

# Input injection (CGEvent*), the pointer shape (NSCursor) and the menu bar
# item (NSStatusItem and friends).
objc2 = "0.6"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
# Features here do not imply sibling features: NSStatusBarButton gets the type
# but none of NSButton's methods, so every superclass in a chain we call
# through has to be listed too.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSCursor",
    "NSImage",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSGraphics",
    "NSApplication",
    # NSApplicationActivationPolicy lives in NSRunningApplication's header, and
    # NSVariableStatusItemLength is a CGFloat, which needs the CF interop.
    "NSRunningApplication",
    "objc2-core-foundation",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSControl",
    "NSCell",
    "NSView",
    "NSResponder",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSWorkspace",
    # The modal panels (src/panels.rs): the agent has no windows, so showing the
    # two public keys and taking a listen address are both NSAlert with an
    # NSTextField accessory. NSWindow comes with NSAlert (`alert.window()`, for
    # focusing a field), NSText and NSFont with the field itself — the keys are
    # monospaced so they can be compared character by character against the
    # gateway's config.
    "NSAlert",
    "NSTextField",
    "NSText",
    "NSFont",
    "NSWindow",
    "NSPopUpButton",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSError",
    "NSURL",
    "NSDate",
    "NSTimer",
    "NSRunLoop",
] }
# SMAppService: the agent registers itself as a login item, so there is no
# install script and no plist in ~/Library/LaunchAgents. macOS 13+; this crate
# targets 14+ (see packaging/macos/Info.plist).
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std",
    "SMAppService",
    # `kSMErrorAlreadyRegistered`, so "already registered" is matched on the real
    # constant rather than a magic number.
    "SMErrors",
    "objc2",
    "objc2-foundation",
] }
