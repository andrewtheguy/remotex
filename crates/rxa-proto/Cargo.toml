[package]
name = "rxa-proto"
version.workspace = true
edition = "2024"

# Deliberately platform-independent and dependency-light: this crate is the one
# place the gateway and the macOS agent agree on the wire, and it must build and
# unit-test on Linux (the agent crate never does). See docs/architecture.md.
[dependencies]
# Noise_NNpsk0_25519_ChaChaPoly_BLAKE2s.
#
# The "pure Rust, so no C toolchain" note that used to be here was wrong: snow's
# default features resolve to `ring`, which compiles C and assembly through `cc`,
# and it does so in *both* halves of the workspace because this crate is shared.
# Left as-is rather than chased — a C toolchain is present on every target the
# release matrix builds on, and the tree has since taken a second one (libwebp,
# see the root Cargo.toml).
snow = "0.10"
# Only the io-util traits — rxa-proto never opens a socket itself, it adapts
# whatever AsyncRead/AsyncWrite the caller hands it.
tokio = { version = "1", features = ["io-util"] }
# Key text encoding (base64url, no padding).
base64 = "0.22"
# Typed wire/key errors, per CLAUDE.md.
thiserror = "2"
# 32 random bytes for `key::generate_private`.
getrandom = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
