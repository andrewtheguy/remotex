[package]
name = "remotex-cef-helper"
version.workspace = true
edition = "2024"
publish = false

# Chromium's subprocess. One binary, wrapped five times over in
# Contents/Frameworks by packaging/macos-viewer/build-viewer-app.sh — renderer,
# GPU, plugin, alerts and the plain one — because macOS wants each with its own
# bundle and Info.plist, not because they differ.
[[bin]]
name = "remotex-cef-helper"
path = "src/main.rs"

[dependencies]
# `sandbox` on, and only here. On macOS it is the helper that links
# `cef_sandbox` and enters the seatbelt before anything else runs; the browser
# process passes a null `sandbox_info` and merely says `no_sandbox = 0`. So the
# Swift app links nothing extra for this.
remotex-cef = { path = "../remotex-cef", features = ["sandbox"] }
