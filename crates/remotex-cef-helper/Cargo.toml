[package]
name = "remotex-cef-helper"
version.workspace = true
edition = "2024"
publish = false

# Chromium's subprocess. One binary, wrapped five times over in
# Contents/Frameworks by packaging/macos-viewer/build-viewer-app.sh — renderer,
# GPU, plugin, alerts and the plain one — because macOS wants each with its own
# bundle and Info.plist, not because they differ.
[[bin]]
name = "remotex-cef-helper"
path = "src/main.rs"

[dependencies]
cef = { version = "151.2", default-features = false, features = ["sandbox"] }
# For the two things both processes must agree about: the `remotex://` scheme and
# the message router's configuration.
remotex-cef = { path = "../remotex-cef" }
