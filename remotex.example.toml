# remotex configuration example
#
# Copy this tracked template before adding credentials; in a checkout:
#
#   cp remotex.example.toml remotex.toml
#
# The binary loads that copy on startup (see src/config.rs). The config is
# global-only: --config <path> if given, else the installed global config
# (/etc/remotex/remotex.toml from a Linux package,
# /usr/local/etc/remotex/remotex.toml from the macOS package, or
# /opt/remotex/etc/remotex.toml in the container). There are no per-user or
# working-directory files. The listen address below is the one setting that can
# also come from outside this file (--listen, or REMOTEX_LISTEN); everything
# else, credentials included, is configured here. Keep this file readable only
# by the service user — it holds credentials.
#
#   chmod 600 remotex.toml
#
# This is a served gateway's file.

# What this gateway calls itself, and the icon it shows. Top-level rather than
# under [server]: it names the deployment rather than the server, and one value
# with two spellings is one of them going stale.
#
# text is the login screen, the interstitials, and the browser tab title;
# defaults to "remotex". logo is the page's tab icon; without it the page keeps
# no icon.
#
#[branding]
#text = "remotex"
#logo = "/path/to/logo.png"
#
# A logo is either a path to an image file (.png, .ico, .svg, .jpg, .gif or
# .webp), or the image itself as a data: URL, for a config with nowhere to put a
# file beside it. Produce one with:
#
#   printf 'data:image/png;base64,%s\n' "$(base64 < logo.png)"
#
# Line breaks inside the base64 are ignored, so a wrapped blob can go straight
# into a TOML multi-line string:
#
#[branding]
#logo = """
#data:image/png;base64,
#iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQ
#DwAEhQGAhKmMIQAAAABJRU5ErkJggg==
#"""

# Throughput of the browser's WebSockets (/ws, /ws/audio, /ws/camera, /ws/mic),
# kept in an SQLite database and shown by the page's "Throughput" view, which
# reads it when opened. Only the hop between the browser and this gateway is
# counted: the bytes of every text and binary frame, WebSocket headers included,
# written to the browser (sent) and read from it (received).
#
# Bytes are grouped by the target the session had selected when they moved, and
# by "no target" while the browser sits on the picker. The meter reads the
# counters once a second, and every minute one record is added per target and
# socket that moved data in that minute — an idle socket adds none — in one
# transaction, carrying the minute's bytes, its busiest second and each second of
# it that moved. A second that moved nothing is not stored. The second is the
# meter's resolution and the minute is only how often it reaches the disk;
# neither is configurable. Each target's socket keeps its newest max_records
# records, so the default is a week of minutes for a socket busy all week. Best
# effort: the minute being counted when the gateway stops is lost.
#
# enabled is the switch, and a [meter] table must say it either way: the other
# keys are the settings and are checked either way too, so a table can keep them
# while it is off. Without a [meter] table, nothing is recorded.
#
# The database is meter.sqlite3 in the gateway's state directory unless database
# names another file; a relative path is taken from that directory too. The state
# directory is /var/lib/remotex for the Linux packages, /usr/local/var/remotex for
# the macOS package, %ProgramData%\remotex on Windows, /opt/remotex/var in the
# container, and the instance directory under `remotex tui`. A config named with --config keeps it in the config's own
# directory. The directory must be writable: SQLite keeps its -wal and -shm files
# beside the database.
#
#[meter]
#enabled = true
#database = "meter.sqlite3"
#max_records = 10080

# The AirPlay speaker a Mac's sound arrives at — EXPERIMENTAL. Gateway-wide:
# with it, every "ard" and "ard-high-performance" target carries audio, and
# without it none does; refused when there is no such target. The gateway announces itself over mDNS as an AirPlay 1 speaker named
# "<[branding].text> - remotex". The Mac picks it once in Control Center →
# Sound and is asked for this password, which it then remembers. The Mac must
# share the gateway's link (mDNS does not cross a router), a container needs the host's
# network, and the ports it uses are ephemeral TCP and UDP. See
# docs/airplay-audio.md.
#
#[airplay]
#password = "choose one"

[server]
# Listen address for the web UI, host:port (optional; default shown). One key,
# because it is one decision — a host without a port is half an answer.
#
# --listen (or REMOTEX_LISTEN in the environment) overrides this, whole: the
# command line cannot supply one half and leave the other to this file. Bracket
# an IPv6 literal, as in "[::1]:52380". A container publishing this port wants
# "0.0.0.0:52380".
#listen = "127.0.0.1:52380"

# The other form is a Unix socket, for a gateway that answers a reverse proxy on
# this machine and nothing else. Everything after "unix:" is the path, so a file
# name is never parsed for a port:
#
#listen = "unix:/run/remotex/gateway.sock"
#
# The socket is created 0660 — owner and group, so the proxy's user reaches it by
# sharing the group and no other local account reaches it at all, which is the
# only reason to prefer one to a loopback port. Arrange the directory to match.
# A socket left behind by a gateway that was killed is taken over on the next
# start; one that something is still serving refuses the start instead.
#
# A browser cannot use this form. The client addresses its gateway by URL — one
# HTTP origin and two WebSockets — so whatever terminates the proxy is what it
# talks to.
# Web login (required): username:bcrypt_hash guarding the whole surface.
# Generate with:  remotex gen-passwd <username>
site_passwd = ""

# DEVELOPMENT ONLY, and inert in any deployment. Gives this gateway its own
# hostname on loopback: a browser opening the home page under *any* loopback name
# that is not this one — 127.0.0.1, ::1, anything in 127/8, localhost, the bare
# remotex.localhost, or another gateway's <other>.remotex.localhost — is redirected
# to http://<label>.remotex.localhost:<port>/, keeping the port. The port decides
# which gateway answers, and that gateway names itself, so http://127.0.0.1:52676/
# lands on the label configured *here*.
#
# Redirecting a mismatched .localhost name matters as much as redirecting a bare
# address: reaching this gateway at another one's hostname would put this session's
# cookie under that name, which is the collision below, arrived at by editing the
# port in the URL bar and not the label.
#
# Only the home page is redirected, and only when the request itself arrived on a
# loopback name — a gateway reached under a real hostname or address ignores this
# however it is set.
#
# It solves one problem: a cookie is scoped by host and ignores the port, so two
# gateways on one machine share one session cookie and each login silently evicts
# the other. Every name under .localhost resolves to loopback without DNS
# (RFC 6761) and is a distinct cookie origin, so two gateways become two
# independent logins in one browser. Running two gateways against one target is
# the only way to test session takeover, which is why this exists at all. The
# names hang off .remotex.localhost so they are one suffix to recognise in a
# browser's history and to clear cookies for, and so no bare label this project
# hands out can collide with whatever else already answers on this machine.
#
# One DNS label: letters, digits and inner hyphens, no dots.
#dev_subdomain = "gw-a"

# Target profiles (at least one required). Each needs a unique name. Every
# profile is served; the browser picks one from a picker after login (there is
# no --target selector).
[[targets]]
name = "example"
protocol = "rdp"           # required: "rdp" or "vnc"
# Which flavour of that protocol the far end is, where a protocol has more than
# one. Only "vnc" has any, and both are macOS Screen Sharing: "ard" and
# "ard-high-performance" (see the two Mac targets below).
#subtype = "ard"
host = "192.0.2.10"
# Default: the protocol's standard port (3389 rdp, 5900 vnc).
#port = 3389

# Credentials (used server-side only; never sent to the browser).
username = "Administrator"
password = "change-me"
# A VNC server's own password (RFB VncAuth) — a separate key because it is a
# separate credential: it proves knowledge of a machine secret and names nobody.
# VNC only, rejected elsewhere. See the VNC target below.
#vnc_password = "change-me"
# Optional domain (leave unset for a local account). RDP only, rejected elsewhere.
#domain = ""

# Optional pinned opening size. Set both keys or neither.
#
# RDP connects at the pinned size, `subtype = "ard-high-performance"` creates its
# virtual display at it, and a generic VNC server is asked for it once, as soon as
# it declares SetDesktopSize support. With neither key, RDP and High Performance
# instead open at the full resolution of the connecting client's own screen,
# falling back to 1440×900 only when the client supplies no screen; an unpinned
# generic VNC server is asked for no size at all and keeps its own.
#
# This is independent of `resize` below, which decides only whether the browser
# window drives the size afterwards. Pinned alone stays at the pin. Pinned with
# `resize = true` opens at the pin and then follows the window on RDP and High
# Performance, which name a size at connect; a generic VNC server is asked only
# for the window, because the browser reports it before the server can declare
# SetDesktopSize support and the newer size supersedes the pin. `subtype = "ard"`
# is the exception — it exposes the Mac's physical displays, which this gateway
# never resizes, so there these keys only answer a later default-size request.
#
# These are points, not backing pixels. RDP opens at 1x and, with `resize`, a
# Retina client then asks for twice the pixels. High Performance opens at the
# connecting client's density even when its point size is pinned.
#width = 1920
#height = 1080

# Dynamic resize (opt-in): hand the remote desktop's size to the client's window.
# The client reports every window change while connected. There is no client-side
# resize toggle, one-shot "Resize to window" button or remembered preference: this
# one target setting is the policy.
#
# One narrowing that is not the client's to make either: generic VNC needs a
# server that accepts SetDesktopSize — the TigerVNC family — and Standard Apple
# `ard` refuses resize outright because it shares physical displays. Apple
# `ard-high-performance` uses Apple's dynamic-resolution feature to replace its
# one virtual display's configuration with arbitrary viewport sizes within its
# fixed 3840×2160 backing ceiling.
#
# Without it — and by default — the desktop keeps its opening size, and resize
# messages are ignored.
#resize = false

# RDP graphics pipeline (MS-RDPEGFX), on by default. On, a Windows host draws the
# desktop through the pipeline's surfaces and marks every frame, and each resize
# is a graphics reset, cheap enough for the window to drive continuously. Off, the
# host draws with bitmap updates and the desktop keeps its opening size —
# `resize = true` is refused beside `egfx = false`; that is the escape hatch for a
# host whose pipeline the decoders cannot paint. RDP only, and refused on VNC even when set to false.
#egfx = true

# Clipboard bridge (opt-in): shares this target's clipboard with the browser.
# Copying on the remote pushes the text out, and your local clipboard is sent
# back whenever the tab regains focus — where the browser permits it, which
# needs HTTPS or localhost, since a plain-HTTP page has no clipboard access at
# all. On a target that transfers a clipboard, the Clipboard panel works
# regardless, and is the way to move text when automatic sync cannot run.
# RDP carries Unicode text over MS-RDPECLIP. Both directions of that protocol are
# lazy — a copy announces the formats it can be had in and the bytes follow on
# request — which the gateway hides: a copy on the remote is fetched at once, and a
# copy here is handed over when the remote pastes.
# VNC carries full Unicode text on servers
# implementing the Extended Clipboard extension (TigerVNC does); on servers that
# do not (TightVNC), RFB falls back to latin-1 and anything outside it becomes "?".
# Both Apple subtypes use the Mac's native UTF-8 pasteboard protocol; High
# Performance carries its fetches and data inside the encrypted record transport.
#clipboard = false

# Remote audio: carry this target's sound when the client asks for it, with the
# floating menu's Audio button. An "rdp" target negotiates sound redirection
# (MS-RDPEA) when it connects, as 44100 Hz 16-bit stereo PCM; without the key the
# host's own audio settings are left untouched and the session has no audio device.
# A Windows host sends nothing on the channel until something plays. A plain
# "vnc" target asks the server for wlshare's audio extension, and one that never
# announces it gives a silent session. On "ard" and "ard-high-performance" the
# key is refused: a Mac's sound comes from the gateway's AirPlay speaker instead,
# which the [airplay] table above turns on for every Mac — EXPERIMENTAL.
#
# The channel has to be negotiated when the connection is made, so an audio
# target asks the server to redirect from the moment it connects and throws the
# sound away while nobody is listening.
#
# Nothing here depends on how the page is reached: the client refuses to start at
# all without a secure context and a pair of WebCodecs decoders, so by the time a
# target is picked, sound works wherever the target carries it — an "rdp" target,
# a plain "vnc" server that speaks wlshare's extension, or a Mac playing to the
# AirPlay speaker.
#
# Off leaves the remote's sound where it is.
#audio = false

# How that audio is carried. Valid only with `audio = true` above; setting it
# without audio is refused rather than ignored.
#
#   "opus" (the default) — variable-rate, 20 ms packets, averaging `audio_bitrate`
#     below and walking down from it when the link falls behind. Right for
#     anything that leaves the building, and the one to leave alone unless the
#     link is a fast local network.
#   "pcm" — the remote's own samples, unencoded and unresampled, at 1.41 Mbit/s.
#     Fifteen times the bandwidth, and in exchange nothing on the way to the browser
#     touches a sample: no encoder here, no resampler here, and no decoder there.
#     What the browser then does with them is its own business — a 44.1 kHz buffer
#     played through a 48 kHz context is resampled on playback, exactly as any
#     output device resamples what does not match its rate.
#
# "pcm" is not the better-sounding option in any way you are likely to hear; it is
# the simpler path. Reach for it on a fast LAN. Guacamole carries desktop audio this
# way and only this way, which is where it came from.
#audio_codec = "opus"

# The Opus bitrate this target's sound holds on a link that can carry it, in
# kbit/s, 6–510. The default is 96: well clear of where stereo Opus starts to be
# audibly lossy. Like `video_quality` it is a ceiling, not a promise — and an
# average, not a packet size: Opus is variable-rate, so silence costs a few bytes
# a packet and music about this. Valid only for Opus audio; PCM has no encoder
# to tune.
#audio_bitrate = 96

# Let that bitrate follow the audio socket's own backpressure — on by default,
# like `render_adaptive`. Sustained slow sends walk the bitrate down toward
# `audio_adaptive_min`, sustained clear sends walk it back up to `audio_bitrate`,
# and silence is shed while the link is behind so old sound does not accumulate.
# `false` holds `audio_bitrate` whatever the link does. Valid only for Opus
# audio; either value is refused beside "pcm".
#audio_adaptive = true

# Floor for that walk in kbit/s, default 32: degraded, but continuous, which is
# the point of giving bitrate up. An explicit floor must be 6–510 and below
# `audio_bitrate`; the default one is held to `audio_bitrate` where that sits
# lower. Refused beside `audio_adaptive = false`.
#audio_adaptive_min = 32

# Camera redirection: offer the remote a virtual webcam whose frames are this
# browser's, over MS-RDPECAM on "rdp" — or, on a generic "vnc" target, over
# wlshare's camera extension, which makes it a PipeWire camera on the wlroots
# desktop; any other VNC server says nothing and the camera is never plugged (see
# docs/wlshare-camera.md). The rest of this note is about RDP.
# EXPERIMENTAL, for lack of tests — the
# socket's rules, its messages and the channel's wire are checked. Only a Windows
# host that creates the camera enumeration channel has anywhere to redirect to: a
# workstation, or a Windows Server carrying the Remote Desktop Session Host role.
# No dummy server here has one. `a_real_host_streams_the_camera` carries H.264
# frames to such a host, but it is ignored by default and does not check the
# pixels the host displays. Unlike `audio` above and the rest of the RDP features,
# which every test run covers, the picture is verified by hand against such a host.
#
# Capability only. The device appears when a client turns the camera on from the
# floating menu — explicitly, per session, never remembered — and is unplugged
# when that client closes it, the session changes hands, or the engine ends. The
# browser encodes H.264 and the gateway passes it through untranscoded, so there
# is no codec key beside this one. Apple's Screen Sharing has nowhere to put a
# camera, so an "ard" or "ard-high-performance" target refuses the key rather than
# ignoring it. A Windows Server without the
# RDSH role never creates the enumeration channel, so an enabled camera against
# one is simply never asked for a frame.
#camera = false

# Microphone redirection: offer the remote this browser's microphone over
# MS-RDPEAI on "rdp" — or, on a generic "vnc" target, over wlshare's microphone
# extension, which makes it a PipeWire audio source on the wlroots desktop; any
# other VNC server says nothing and the microphone is never plugged (see
# docs/wlshare-microphone.md). EXPERIMENTAL, like `camera`. Capability only: the recording
# device is fed when a client turns the microphone on from the floating menu —
# per session, never remembered. The browser sends mono speech Opus at a fixed
# low bitrate and the gateway decodes it to the PCM the host records in, so there
# is no codec or quality key beside this one. The host starts recording only
# once an application on it does. An "ard" or "ard-high-performance" target
# refuses the key.
#microphone = false

# A VNC target needs host and, usually, one of the two passwords; domain is
# refused, and width/height only ever answer a default-size request (see above).
# `vnc_password` is the server's own password and is all a server without user
# accounts takes.
# [[targets]]
# name = "workstation-vnc"
# protocol = "vnc"
# host = "10.0.0.2"
# vnc_password = "change-me"

# A wlroots-based Wayland desktop behind the wlshare VNC server is a plain "vnc"
# target. Every plain target asks its server for wlshare's pixel-density
# extension, so a `scale 2` output is shown at 2x and a resizing window is asked
# for in points × scale; a server that does not answer is shown at 1x. With a
# username and password, wlshare checks the account it runs as through PAM over
# RSA-AES, encrypting the session; a password_file on the server is its VNC
# password instead, which goes in vnc_password. See docs/wlshare-density.md.
# [[targets]]
# name = "workstation-wayland"
# protocol = "vnc"
# host = "127.0.0.1"
# username = "me"
# password = "that-account's-password"
# resize = true

# A Mac uses its built-in Screen Sharing service through this same path, with no
# additional software — say so with a subtype, and give it an *account* rather than
# the Screen Sharing password. Apple's DH authentication is the only way to tell a
# Mac who is connecting, and macOS answers a viewer that names nobody by creating a
# new login window on a virtual display instead of sharing its screen. So both
# subtypes require username and password (that account's) and take no
# vnc_password. Resize is where they part: `ard` is refused outright — a config
# setting it does not load — because it shares the Mac's physical displays, while
# `ard-high-performance` takes it for the one virtual display it makes, as the
# second example below does. A third-party VNC server that happens to run on a
# Mac is not this: it is a plain "vnc" target.
#
# `subtype = "ard"` is standard screen sharing on the ordinary RFB wire: the Mac's
# physical display list and native pasteboard, with one framebuffer holding every
# attached display at once, sent as zlib rectangles.
# [[targets]]
# name = "mac-screen-sharing"
# protocol = "vnc"
# subtype = "ard"
# host = "10.0.0.3"
# username = "andrew"
# password = "the-account-password"

# Alone among the subtypes, nothing this one speaks is documented by Apple: the
# protocol revision, its record layer, its control messages and its virtual
# display handling were all reverse engineered, and are only as correct as the
# Macs they have been measured against. A macOS update is free to change any of
# it. The dynamic-resolution descriptor has been measured across arbitrary sizes
# and a burst of viewport reports but remains reverse engineered.
#
# `subtype = "ard-high-performance"` requests one virtual display instead of the
# Mac's physical displays. It opens at the pinned `width` and `height` when both
# are set, or at the full resolution of the client's screen otherwise, at that
# screen's density. Once connected, the Mac's physical displays are disabled and
# all of its windows are placed on this virtual display. The same zlib rectangles
# are carried over Apple's encrypted protocol revision. Apple's official macOS
# Screen Sharing client can choose up to two virtual displays; remotex requests
# one. With `resize = true`, viewport reports continuously replace the virtual
# display's mode as the window changes. Apple's display-count and fixed-resolution-
# preset controls are not implemented.
#
# `clipboard = true` enables the native Apple pasteboard in both directions.
# See docs/apple-vnc-889.md.
# [[targets]]
# name = "mac-virtual-display"
# protocol = "vnc"
# subtype = "ard-high-performance"
# host = "10.0.0.3"
# username = "andrew"
# password = "the-account-password"
# width = 1600
# height = 1000
# clipboard = true
# resize = true

# How this target's desktop is streamed to the browser: the whole framebuffer as one
# VP9 video stream, for every protocol. Every key below is per target, so it belongs
# *inside* a [[targets]] table and not in a section of their own — uncommented here
# they would attach to whichever [[targets]] block precedes them, which is the
# "example" one at the top of this file. There is no global render setting, and
# every key has a default.
#
# video_quality is the dial, 1-100 and defaulting to 90. It is a *ceiling*: on a link
# that can carry it you get exactly that quality, and a link that cannot makes the
# picture coarser until it can, down to render_adaptive_min. Nothing ever goes finer
# than what is set here.
#
# It is decoded with WebCodecs, which is **secure-context only** — the same limit
# remote audio has. A browser pointed at a gateway on a plain-HTTP LAN address shows
# a banner saying so instead of a desktop, until it is behind TLS (localhost is
# exempt).
#video_quality = 90

# How much colour the stream carries per pixel. Left out, it is "auto": the
# browser's own decoder decides. The other two answers take that decision away from
# it, for every browser alike.
#
#   "420"  — one colour sample per 2×2 pixels (VP9 profile 0). The one every decoder
#            takes, hardware ones included, sent even to a decoder that would have
#            taken the colour.
#   "444"  — a colour sample per pixel (VP9 profile 1). This, not video_quality, is
#            where a desktop stream's visible loss is: a one-pixel coloured glyph stem
#            on a dark terminal shares its one 4:2:0 colour sample with three pixels of
#            background and comes back at a quarter of its saturation, at any quality
#            — measured, lossless 4:2:0 is no better than quality 100. 4:4:4 keeps it,
#            for a keyframe about a third larger and inter frames no larger. It always
#            decodes in software (no hardware VP9 decoder takes profile 1): Chromium
#            does; iOS and iPadOS have no software VP9 at all and refuse it by name,
#            and this setting sends it to them anyway.
#   "auto" — 4:4:4 where the browser's decoder takes profile 1, 4:2:0 where it says it
#            does not. The default. The page asks its own VideoDecoder once, at load,
#            and states the answer on its session socket.
#
# Which to write down:
#
#   Watched from more than one kind of browser — a desktop and an iPad, say — leave
#   the key out. "auto" is the whole reason this target need not be duplicated under
#   two names, and every browser gets the best picture it can actually decode.
#
#   Set "444" only to hold a fleet to one bitstream or to pin one side of a measurement:
#   it asks nobody, so any iOS or iPadOS client sees the decoder's refusal instead of a
#   desktop. On the browsers that do take it the cost is client CPU — twice the chroma
#   samples per frame, and no hardware path — which in this system's experience is the
#   safer decoder anyway: the GPU-process one is what goes quiet under stream churn.
#
#   Set "420" for a fleet that must stay on a hardware decoder, or where the target is
#   photographic rather than text and the extra colour buys nothing worth the bytes.
#render_chroma = "auto"

# `video_quality` tracks measured client queueing — on unless this turns it off. The
# configured quality remains the ceiling; the stream adds the client's paint lag to its
# existing send-pressure signal, and never goes below render_adaptive_min.
#
# Turning it off walks on send pressure alone, floored at 1, which is worth having only
# to pin one side of a measurement.
#render_adaptive = true

# Floor for that adaptive walk, 1–100 and defaulting to 20. Refused beside
# `render_adaptive = false`, and it may not exceed `video_quality`. A target whose
# dial sits below the default floor walks down to that dial instead — the default
# never asks a stream for a quality it does not send.
#render_adaptive_min = 20
