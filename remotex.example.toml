# remotex configuration example
#
# Copy this tracked template before adding credentials; in a checkout:
#
#   cp remotex.example.toml remotex.toml
#
# The binary loads that copy on startup (see src/config.rs). The config is
# global-only: --config <path> if given, else the installed global config
# (/etc/remotex/remotex.toml from a Linux package,
# /usr/local/etc/remotex/remotex.toml from the macOS package, or
# <prefix>/etc/remotex.toml from the quick installer). There are no per-user or
# working-directory files. The listen address below is the one setting that can
# also come from outside this file (--listen, or REMOTEX_LISTEN); everything
# else, credentials included, is configured here. Keep this file readable only
# by the service user — it holds credentials.
#
#   chmod 600 remotex.toml
#
# This is a served gateway's file.

# What this gateway calls itself, and the icon it shows. Top-level rather than
# under [server]: it names the deployment rather than the server, and one value
# with two spellings is one of them going stale.
#
# text is the login screen, the interstitials, and the browser tab title;
# defaults to "remotex". logo is the page's tab icon; without it the page keeps
# no icon.
#
#[branding]
#text = "remotex"
#logo = "/path/to/logo.png"
#
# A logo is either a path to an image file (.png, .ico, .svg, .jpg, .gif or
# .webp), or the image itself as a data: URL, for a config with nowhere to put a
# file beside it. Produce one with:
#
#   printf 'data:image/png;base64,%s\n' "$(base64 < logo.png)"
#
# Line breaks inside the base64 are ignored, so a wrapped blob can go straight
# into a TOML multi-line string:
#
#[branding]
#logo = """
#data:image/png;base64,
#iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQ
#DwAEhQGAhKmMIQAAAABJRU5ErkJggg==
#"""

[server]
# Listen address for the web UI, host:port (optional; default shown). One key,
# because it is one decision — a host without a port is half an answer.
#
# --listen (or REMOTEX_LISTEN in the environment) overrides this, whole: the
# command line cannot supply one half and leave the other to this file. Bracket
# an IPv6 literal, as in "[::1]:52380". A container publishing this port wants
# "0.0.0.0:52380".
#listen = "127.0.0.1:52380"

# The other form is a Unix socket, for a gateway that answers a reverse proxy on
# this machine and nothing else. Everything after "unix:" is the path, so a file
# name is never parsed for a port:
#
#listen = "unix:/run/remotex/gateway.sock"
#
# The socket is created 0660 — owner and group, so the proxy's user reaches it by
# sharing the group and no other local account reaches it at all, which is the
# only reason to prefer one to a loopback port. Arrange the directory to match.
# A socket left behind by a gateway that was killed is taken over on the next
# start; one that something is still serving refuses the start instead.
#
# A browser cannot use this form. The client addresses its gateway by URL — one
# HTTP origin and two WebSockets — so whatever terminates the proxy is what it
# talks to.
# Directory of the built frontend. Defaults to share/remotex/web in the active
# version (or frontend/dist in a checkout). Only set to override.
#static_dir = ""
# Web login (required): username:bcrypt_hash guarding the whole surface.
# Generate with:  remotex gen-passwd <username>
site_passwd = ""

# DEVELOPMENT ONLY, and inert in any deployment. Gives this gateway its own
# hostname on loopback: a browser opening the home page under *any* loopback name
# that is not this one — 127.0.0.1, ::1, anything in 127/8, localhost, the bare
# remotex.localhost, or another gateway's <other>.remotex.localhost — is redirected
# to http://<label>.remotex.localhost:<port>/, keeping the port. The port decides
# which gateway answers, and that gateway names itself, so http://127.0.0.1:52676/
# lands on the label configured *here*.
#
# Redirecting a mismatched .localhost name matters as much as redirecting a bare
# address: reaching this gateway at another one's hostname would put this session's
# cookie under that name, which is the collision below, arrived at by editing the
# port in the URL bar and not the label.
#
# Only the home page is redirected, and only when the request itself arrived on a
# loopback name — a gateway reached under a real hostname or address ignores this
# however it is set.
#
# It solves one problem: a cookie is scoped by host and ignores the port, so two
# gateways on one machine share one session cookie and each login silently evicts
# the other. Every name under .localhost resolves to loopback without DNS
# (RFC 6761) and is a distinct cookie origin, so two gateways become two
# independent logins in one browser. Running two gateways against one target is
# the only way to test session takeover, which is why this exists at all. The
# names hang off .remotex.localhost so they are one suffix to recognise in a
# browser's history and to clear cookies for, and so no bare label this project
# hands out can collide with whatever else already answers on this machine.
#
# One DNS label: letters, digits and inner hyphens, no dots.
#dev_subdomain = "gw-a"

# Target profiles (at least one required). Each needs a unique name. Every
# profile is served; the browser picks one from a picker after login (there is
# no --target selector).
[[targets]]
name = "example"
protocol = "rdp"           # required: "rdp" or "vnc"
# Which flavour of that protocol the far end is, where a protocol has more than
# one. Only "vnc" has any, and both are macOS Screen Sharing: "ard" and
# "ard-high-performance" (see the two Mac targets below).
#subtype = "ard"
host = "192.0.2.10"
# Default: the protocol's standard port (3389 rdp, 5900 vnc).
#port = 3389

# Credentials (used server-side only; never sent to the browser).
username = "Administrator"
password = "change-me"
# A VNC server's own password (RFB VncAuth) — a separate key because it is a
# separate credential: it proves knowledge of a machine secret and names nobody.
# VNC only, rejected elsewhere. See the VNC target below.
#vnc_password = "change-me"
# Optional domain (leave unset for a local account). RDP only.
#domain = ""

# Optional pinned opening size. Set both keys or neither.
#
# RDP connects at the pinned size, `subtype = "ard-high-performance"` creates its
# virtual display at it, and a generic VNC server is asked for it once, as soon as
# it declares SetDesktopSize support. With neither key, RDP and High Performance
# instead open at the full resolution of the connecting client's own screen,
# falling back to 1920×1080 only when the client supplies no screen; an unpinned
# generic VNC server is asked for no size at all and keeps its own.
#
# This is independent of `resize` below, which decides only whether the browser
# window drives the size afterwards. Pinned alone stays at the pin. Pinned with
# `resize = true` opens at the pin and then follows the window on RDP and High
# Performance, which name a size at connect; a generic VNC server is asked only
# for the window, because the browser reports it before the server can declare
# SetDesktopSize support and the newer size supersedes the pin. `subtype = "ard"`
# is the exception — it exposes the Mac's physical displays, which this gateway
# never resizes, so there these keys only answer a later default-size request.
#
# These are points, not backing pixels. RDP opens at 1x and, with `resize`, a
# Retina client then asks for twice the pixels. High Performance opens at the
# connecting client's density even when its point size is pinned.
#width = 1920
#height = 1080

# Security mode: "auto" (TLS+NLA, default), "nla" (NLA only), "tls" (no NLA).
# RDP only — VNC negotiates VncAuth (password set) or None per the handshake, so the
# key is refused on a vnc target rather than ignored, whatever its value.
#security = "auto"

# Allow a logon over TLS without NLA — "tls" above, or a server that picks it under
# "auto". The gateway verifies no server certificate, so without NLA the
# credentials go to whoever answered; with NLA they are bound to the server's TLS
# key and useless to an interceptor. So it is refused unless this is set, and a
# session that uses it says so in the log. xrdp speaks no NLA and needs it.
# RDP only.
#allow_plain_tls = false

# Dynamic resize (opt-in): hand the remote desktop's size to the client's window.
# The client reports every window change while connected. There is no client-side
# resize toggle, one-shot "Resize to window" button or remembered preference: this
# one target setting is the policy.
#
# One narrowing that is not the client's to make either: generic VNC needs a
# server that accepts SetDesktopSize — the TigerVNC family — and Standard Apple
# `ard` refuses resize outright because it shares physical displays. Apple
# `ard-high-performance` uses Apple's dynamic-resolution feature to replace its
# one virtual display's configuration with arbitrary viewport sizes within its
# fixed 3840×2160 backing ceiling.
#
# Without it — and by default — the desktop keeps its opening size, and resize
# messages are ignored.
#resize = false

# RDP graphics pipeline, on by default and independent of `resize`. With both on,
# each resize is an EGFX graphics reset: no reactivation or reconnect, so it is
# cheap enough for the window to drive continuously. The trade is that a Windows
# host's text stays soft after the resize. Set this false for the sharp legacy
# path, whose reactivation re-renders the desktop at each size. RDP only, and
# refused on VNC even when set to false.
#egfx = true

# Clipboard bridge (opt-in): shares this target's clipboard with the browser.
# Copying on the remote pushes the text out, and your local clipboard is sent
# back whenever the tab regains focus — where the browser permits it, which
# needs HTTPS or localhost, since a plain-HTTP page has no clipboard access at
# all. On a target that transfers a clipboard, the Clipboard panel works
# regardless, and is the way to move text when automatic sync cannot run.
# RDP carries no clipboard: the key is accepted and the session connects, but the
# panel gets no remote text and nothing copied in the browser reaches the remote.
# VNC carries full Unicode text on servers
# implementing the Extended Clipboard extension (TigerVNC does); on servers that
# do not (TightVNC), RFB falls back to latin-1 and anything outside it becomes "?".
# Both Apple subtypes use the Mac's native UTF-8 pasteboard protocol; High
# Performance carries its fetches and data inside the encrypted record transport.
#clipboard = false

# Remote audio: carry this target's sound when the client asks for it, with the
# floating menu's Audio button. RDP carries no sound: the key is accepted, and
# the session connects silent. An
# "ard-high-performance" target carries the Mac's system audio over Apple's media
# stream — EXPERIMENTAL, and only in a gateway built by hand with
# `cargo build --release --features apple-hp-audio`, because that stream is AAC-ELD
# and the decoder's licence keeps it out of every release binary; any other build
# refuses the key at startup. A plain "vnc" target asks the server for the QEMU
# Audio extension, and one that never announces it gives a silent session; Standard
# Apple "ard" has no sound and refuses the key rather than ignoring it.
#
# The channel has to be negotiated when the connection is made, so an audio
# target asks the server to redirect from the moment it connects and throws the
# sound away while nobody is listening. The Mac's stream decodes to 48000 Hz
# 16-bit stereo. The Mac sends
# by UDP to this gateway's address on a port it chooses, so it must reach the
# gateway directly.
#
# Nothing here depends on how the page is reached: the client refuses to start at
# all without a secure context and a pair of WebCodecs decoders, so by the time a
# target is picked, sound works wherever the target carries it — a plain "vnc"
# server that speaks the QEMU extension, or "ard-high-performance" in an
# apple-hp-audio build. An RDP session stays silent, as above.
#
# Off leaves the remote's sound where it is. An RDP session has no audio device
# either way.
#audio = false

# How that audio is carried. Valid only with `audio = true` above; setting it
# without audio is refused rather than ignored.
#
#   "opus" (the default) — 96 kbps, 20 ms packets. Well clear of where stereo Opus
#     starts to be audibly lossy. Right for anything that leaves the building, and
#     the one to leave alone unless the link is a fast local network.
#   "pcm" — the remote's own samples, unencoded and unresampled, at 1.41 Mbit/s.
#     Fifteen times the bandwidth, and in exchange nothing on the way to the browser
#     touches a sample: no encoder here, no resampler here, and no decoder there.
#     What the browser then does with them is its own business — a 44.1 kHz buffer
#     played through a 48 kHz context is resampled on playback, exactly as any
#     output device resamples what does not match its rate.
#
# "pcm" is not the better-sounding option in any way you are likely to hear; it is
# the simpler path. Reach for it on a fast LAN. Guacamole carries desktop audio this
# way and only this way, which is where it came from.
#audio_codec = "opus"

# Opus bitrate in kbit/s, 6–510. The default is 96. Valid only for Opus audio;
# PCM has no encoder to tune.
#audio_bitrate = 96

# Let Opus adapt to the audio socket's own backpressure. The configured bitrate
# stays the ceiling: sustained slow sends walk it down, sustained clear sends
# walk it back up, and silence is shed while the link is behind so old sound does
# not accumulate. Off by default, and valid only for Opus audio.
#audio_adaptive = false

# Floor for that adaptive walk in kbit/s, default 32. Valid only with
# `audio_adaptive = true`; an explicit floor must be 6–510 and below the bitrate
# ceiling.
#audio_bitrate_min = 32

# A VNC target needs host and, usually, one of the two passwords; domain is
# ignored, an explicit security is refused, and width/height only ever answer a
# default-size request (see above). `vnc_password` is the server's own password
# and is all a server without user accounts takes.
# [[targets]]
# name = "workstation-vnc"
# protocol = "vnc"
# host = "10.0.0.2"
# vnc_password = "change-me"

# A wlroots-based Wayland desktop behind the wlshare VNC server reports the pixel
# density of its output over one private RFB extension, so a `scale 2` output is
# shown at 2x and a resizing window is asked for in points × scale. The subtype is explicit
# because it changes what goes on the wire; a plain "vnc" target to the same
# server stays at 1x. Like a Mac's, the credentials are an account's: wlshare
# checks the username and password of the account it runs as through PAM over
# RSA-AES, encrypting the session. A password_file on the server is its VNC
# password, which a plain "vnc" target takes as vnc_password. See
# docs/wlshare-density.md.
# [[targets]]
# name = "workstation-wayland"
# protocol = "vnc"
# subtype = "wlshare"
# host = "127.0.0.1"
# username = "me"
# password = "that-account's-password"
# resize = true

# A Mac uses its built-in Screen Sharing service through this same path, with no
# additional software — say so with a subtype, and give it an *account* rather than
# the Screen Sharing password. Apple's DH authentication is the only way to tell a
# Mac who is connecting, and macOS answers a viewer that names nobody by creating a
# new login window on a virtual display instead of sharing its screen. So both
# subtypes require username and password (that account's) and take no
# vnc_password. Resize is where they part: `ard` is refused outright — a config
# setting it does not load — because it shares the Mac's physical displays, while
# `ard-high-performance` takes it for the one virtual display it makes, as the
# second example below does. A third-party VNC server that happens to run on a
# Mac is not this: it is a plain "vnc" target.
#
# `subtype = "ard"` is standard screen sharing on the ordinary RFB wire: the Mac's
# physical display list and native pasteboard, with one framebuffer holding every
# attached display at once. The first encoding list must remain zlib-free so the
# display layout arrives; a second list then switches the pixels from raw to zlib.
# [[targets]]
# name = "mac-screen-sharing"
# protocol = "vnc"
# subtype = "ard"
# host = "10.0.0.3"
# username = "andrew"
# password = "the-account-password"

# Alone among the subtypes, nothing this one speaks is documented by Apple: the
# protocol revision, its record layer, its control messages and its virtual
# display handling were all reverse engineered, and are only as correct as the
# Macs they have been measured against. A macOS update is free to change any of
# it. The dynamic-resolution descriptor has been measured across arbitrary sizes
# and a burst of viewport reports but remains reverse engineered.
#
# `subtype = "ard-high-performance"` requests one virtual display instead of the
# Mac's physical displays. It opens at the pinned `width` and `height` when both
# are set, or at the full resolution of the client's screen otherwise, at that
# screen's density. Once connected, the Mac's physical displays are disabled and
# all of its windows are placed on this virtual display. The same zlib rectangles
# are carried over Apple's encrypted protocol revision. Apple's official macOS
# Screen Sharing client can choose up to two virtual displays; remotex requests
# one. With `resize = true`, viewport reports continuously replace the virtual
# display's mode as the window changes. Apple's display-count and fixed-resolution-
# preset controls are not implemented.
#
# `clipboard = true` enables the native Apple pasteboard in both directions.
# See docs/apple-vnc-889.md.
# [[targets]]
# name = "mac-virtual-display"
# protocol = "vnc"
# subtype = "ard-high-performance"
# host = "10.0.0.3"
# username = "andrew"
# password = "the-account-password"
# width = 1600
# height = 1000
# clipboard = true
# resize = true

# How this target's pixels are compressed on their way to the browser. A transport,
# a still-image codec, and a quality dial, all per target and valid for every protocol.
#
# All three are per-target keys, so they belong *inside* a [[targets]] table and not
# in a section of their own — uncommented here they would attach to whichever
# [[targets]] block precedes them, which is the "example" one at the top of this file.
# There is no global render setting.
#
# The two axes are independent. render_type is the *transport* — what kind of
# thing goes on the wire:
#
#   "tiles"  (the default) — every changed region as an independent still image.
#   "video"  — the whole desktop as one video stream. Its own block below.
#
# Motion is not a third value here: it changes nothing about what a tile is or how
# one travels, it only adds a cheaper encode for whatever is moving on top of the
# tiles a target already sends. So it is a switch on "tiles" — render_motion, its
# own block below.
#
# render_subtype is the codec of the base tiles, and any of the four pairs with
# "tiles" ("video" sends no tiles and refuses the key):
#
#   "png"      (the default) — lossless: exact pixels, and the right answer on
#              a LAN. The only lossless codec there is; the choice below is all
#              on the lossy side.
#   "jpeg"     — every tile at one fixed quality, for a link that cannot afford
#              exact pixels. Text softens along with everything else; that is
#              the trade of the single knob.
#   "webp"     — the same trade in the other lossy codec: fewer bytes at the same
#              quality, and more gateway CPU to produce them. Worth it on a link
#              narrower than this gateway is busy; not worth it the other way
#              round. Nobody can decide that for you, which is why both are here
#              and neither is the default.
#   "classify" — per tile, whichever fits: a picture classifier reads
#              each tile's own pixels, and only what looks photographic — a
#              photo, a thumbnail, a gradient — goes to the lossy codec at
#              render_subtype_quality;
#              flat UI and text stay lossless PNG, which for them is smaller
#              *and* sharp. PNG is also the verdict for every small or ambiguous
#              tile, because a photo sent lossless only costs bytes while text
#              sent lossy stays soft until that region next changes. What it
#              costs is a little gateway CPU per tile, on the encode workers.
#
# render_subtype_quality is 1-100 and is *required* whenever the subtype is lossy
# ("jpeg", "webp", "classify"), refused when it is "png" — there is no default,
# because a
# quality nobody chose is not a quality. Higher is larger and closer to exact. It is
# the base codec's dial and nothing else's: render_stream_quality, below, is the dial
# of whatever VP9 stream a target has, and is refused on one that streams nothing.
# One key for both lossy codecs, because it is one dial: which codec spends it is
# render_subtype's business, not a second number's.
#
# The defaults, spelled out. Nothing to add: PNG is lossless, so a quality here is
# refused rather than ignored.
#render_type = "tiles"
#render_subtype = "png"
#
# A fixed lossy encode instead — naming "tiles" is optional, it is the default:
#render_subtype = "jpeg"
#render_subtype_quality = 75
#
# The same, in the other lossy codec:
#render_subtype = "webp"
#render_subtype_quality = 75
#
# Or the classifier deciding per tile:
#render_subtype = "classify"
#render_subtype_quality = 75
#
# Which lossy codec the classifier hands its photographic tiles to; "jpeg" unless
# set. It moves nothing about the classifier itself — the same pixels get the same
# verdict, and everything flat still goes out as lossless PNG — only which encoder
# carries the photographic verdict out. Valid only with render_subtype = "classify":
# "jpeg" and "webp" have already named their encoder, and "png" has no lossy side
# for it to describe.
#render_subtype = "classify"
#render_subtype_quality = 75
#render_classify_lossy = "webp"
#
# QA aid for "classify", off unless asked for: outline every tile the classifier
# sent lossy in yellow, in the pixels themselves, so which regions it reads as
# photographic is something you read off the screen rather than infer from how soft
# they look. PNG tiles are never outlined — sharp-and-unmarked is the quiet
# majority — and the mark lives exactly as long as the lossy tile it describes:
# the next change repaints it away. Valid only with render_subtype = "classify",
# with or without render_motion; the colour is its own so it stays readable beside
# the render_motion outlines below.
#render_classify_debug = false

# QA aid for the tiles themselves, off unless asked for: draw the gateway's own
# tile lattice — 64 points, so 64 pixels at 1x and 128 at 2x — over the desktop as
# dashed lines, so where damage is cut is something the screen shows rather than
# something read out of a constant. Valid
# under "tiles" — the transport that sends tiles — and refused under "video", which
# sends the whole desktop as one stream and has no boundary to draw.
#
# Unlike the two outlines above, nothing is painted into the pixels: the browser
# draws the lattice on a layer over the framebuffer. It has to, and that is worth
# knowing rather than a detail — the outlines mark a decision made about one tile
# and travel with it, while the lattice is fixed to the screen and tiles are not.
# Pixels get moved sideways when the remote scrolls, a cached tile is redrawn
# wherever the gateway names, and a corner nothing has changed is never re-sent.
# So the lines go over the picture, where they are exact everywhere from the first
# frame and cost the encoders nothing. It combines with either outline above.
#render_grid_debug = false

# render_motion = true hands the cells that are currently changing fast to a video
# stream, re-sending each one at the base encode once it settles. The cells in motion
# are coalesced into regions and each region gets its own stream, while the base codec
# carries everything else. A video in a window costs its own pixels; the text beside
# it stays exactly what render_subtype says, and is never re-encoded at all.
#
# It is a switch rather than a render_type because it takes nothing away: a target
# with it set sends the same tiles it sent without it, and the ones in motion are
# simply carried by something cheaper while they move. Refused under
# render_type = "video", which streams the whole desktop already and has no settled
# cells left to discount.
#
# A region has to be big enough to be a video before it is streamed: anything
# changing in fewer than five cells on its own — a spinner, a progress bar, a typing
# indicator, up to a 2x2 block of the grid — stays on render_subtype like everything
# settled. That is where it is cheapest: a spinner is a few kilobytes a change as a
# still and compresses well, where a stream would cost an encoder, a keyframe, a
# decoder in the browser and a crisp re-send every time it stopped and started.
# Only a small mover sitting inside a larger moving region's box rides that stream.
#
# render_motion does not replace the base keys, it builds on them: render_subtype and
# render_subtype_quality mean exactly what they mean without it, they just describe
# the settled cells only. So render_subtype_quality is still refused over a "png" base
# — there is nothing to turn down — and still required over "jpeg" or "classify".
#
# render_stream_quality is the streams' own dial, required by render_motion — the
# switch has no quality of its own and none is invented for it. It is a *ceiling*: on
# a link that can carry it you get that quality, and a link that cannot makes the
# picture coarser until it can. Nothing goes finer than what is set here. It can be
# very low — motion hides it, and it does not last. There is no codec key beside it:
# a moving region is VP9, the same as render_type = "video", and render_chroma below
# is the only choice inside it.
#
# It is the same key render_type = "video" uses below, and deliberately: both are the
# quality of a VP9 stream, they reach the same encoder through the same congestion
# walk, and a target can never have both — motion discounts settled tiles and "video"
# has none. One dial, one name.
#
# A region that stops moving ends its stream and is re-sent once at the base encode,
# so a paused video sharpens by itself.
#
# The secure-context note under "video" below applies here too: the access units are
# decoded with WebCodecs either way. The difference is what a browser that cannot
# decode them is left with — a desktop with a blank rectangle where the video is,
# rather than no desktop at all.
#
# A lossless base with streaming motion — everything settled is exact:
#render_motion = true
#render_stream_quality = 30
#
# A lossy base, for a link that cannot afford PNG for the settled cells either:
#render_subtype = "jpeg"
#render_subtype_quality = 60
#render_motion = true
#render_stream_quality = 30
#
# The classifier as the base: settled photos JPEG at 60, settled text lossless,
# and whatever is moving in a stream until it stops:
#render_subtype = "classify"
#render_subtype_quality = 60
#render_motion = true
#render_stream_quality = 30

# render_type = "video" is not a codec on the subtype axis, it is a different
# transport: the whole
# desktop as one video stream instead of one encoded image per changed region. Every
# frame says what changed since the one before it, so nothing is cut into per-region
# tiles and the cell grid does not apply — which is why it takes no render_subtype and
# refuses one, "png" included: that is the value an omitted key reads as elsewhere, but
# a key that is written names an expectation this transport cannot meet. (The frames still travel in the same records the still codecs use, each
# carrying the desktop rectangle a client crops to; what goes away is the segmentation,
# not the framing.)
#
# render_stream_quality is the dial — the same key render_motion uses above, since
# both name the quality of a VP9 stream. 1-100 as everywhere else, and a *ceiling*: on a
# link that can carry it you get exactly that quality, and a link that cannot makes
# the picture coarser until it can. Nothing ever goes finer than what is set here.
#
# One thing to know before choosing it:
#
#   - It is decoded with WebCodecs, which is **secure-context only** — the same limit
#     remote audio already has. A browser pointed at a gateway on a plain-HTTP LAN
#     address shows a banner saying so instead of a desktop, until it is behind TLS
#     (localhost is exempt).
#
# Worth measuring rather than assuming: it is a large win on anything that moves and
# it costs CPU on the gateway for every frame, including on a screen that is barely
# changing. The `encode totals` log line is what settles it for a given target.
#render_type = "video"
#render_stream_quality = 60

# How much colour a video stream carries per pixel — every stream this target has,
# render_type = "video" and render_motion = true alike. Refused on a target that
# streams nothing.
#
#   "420"  — one colour sample per 2×2 pixels (VP9 profile 0). The default, and the one
#            every decoder takes, hardware ones included.
#   "444"  — a colour sample per pixel (VP9 profile 1). This, not render_stream_quality, is
#            where a desktop stream's visible loss is: a one-pixel coloured glyph stem
#            on a dark terminal shares its one 4:2:0 colour sample with three pixels of
#            background and comes back at a quarter of its saturation, at any quality
#            — measured, lossless 4:2:0 is no better than quality 100. 4:4:4 keeps it,
#            for a keyframe about a third larger and inter frames no larger. It always
#            decodes in software (no hardware VP9 decoder takes profile 1): Chromium
#            does; iOS and iPadOS have no software VP9 at all and refuse it by name,
#            and this setting sends it to them anyway.
#   "auto" — 4:4:4 where the browser's decoder takes profile 1, 4:2:0 where it says it
#            does not. The page asks its own VideoDecoder once, at load, and states the
#            answer on its session socket.
#
# Which to write down:
#
#   Watched from more than one kind of browser — a desktop and an iPad, say — use
#   "auto". It is the whole reason this target need not be duplicated under two names,
#   and every browser gets the best picture it can actually decode.
#
#   Set "444" only to hold a fleet to one bitstream or to pin one side of a measurement:
#   it asks nobody, so any iOS or iPadOS client sees the decoder's refusal instead of a
#   desktop. On the browsers that do take it the cost is client CPU — twice the chroma
#   samples per frame, and no hardware path — which in this system's experience is the
#   safer decoder anyway: the GPU-process one is what goes quiet under stream churn.
#
#   Set "420" (or leave the key out) for a fleet that must stay on a hardware decoder,
#   or where the target is photographic rather than text and the extra colour buys
#   nothing worth the bytes.
#render_chroma = "420"

# Let every lossy quality in this target's render plan track measured client
# queueing. The configured qualities remain ceilings. JPEG tiles lower their
# quality per encode; video streams add the client's paint lag to their existing
# send-pressure signal. Refused on lossless PNG tiles — the one plan with no
# lossy dial to move — that is a "png" base with no render_motion.
#render_adaptive = false

# Floor for that adaptive walk, 1–100 and defaulting to 20. Valid only with
# `render_adaptive = true`, and it may not exceed any configured render quality.
#render_adaptive_min = 20

# QA aid for render_motion, off unless asked for: outline every piece the motion
# path emits in the pixels themselves, so which cells it put in motion is something
# you read off the screen rather than infer from how blurry a region looks.
#
#   magenta — the outline of a streamed region, drawn on the picture the encoder
#             sees rather than on the pixels a cleanup restores. Magenta over
#             something that is not moving is the detection reaching further than
#             the movement.
#   cyan    — sent at the base encode from inside a split region: a quiet cell
#             beside a moving one, and so the edge of the split.
#   green   — a cleanup: a settled cell restored to the base encode.
#
# An unmarked region was sent whole at the base encode, which is the quiet path and
# most of a still screen. So a blurry region with no outline on it is not a live
# decision at all — it is a stale one that nothing has replaced.
#render_motion_debug = false
