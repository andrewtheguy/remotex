<?xml version="1.0" encoding="UTF-8"?>
<!--
  The icon an instance app wears when its folder does not supply one — the same
  display as icon.svg on an amber body instead of a blue one, so the main app and
  its shims never read as the same thing in the Dock. Chrome gives each of its
  shims the site's own icon; the folder's optional icon.icns plays that role here,
  and this file is only the default behind it.

  Rasterized by make-icon.sh into instance-icon.icns, shipped in
  Contents/Resources and copied into each shim at creation. Edit this, run that,
  commit both. Same geometry and same no-filter rule as icon.svg, for the same
  reasons.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5A75B"/>
      <stop offset="1" stop-color="#9B4A23"/>
    </linearGradient>
    <!-- The soft top-left light every macOS icon body has. -->
    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5E6DC"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#402215"/>
      <stop offset="1" stop-color="#22100A"/>
    </linearGradient>
    <!-- A screen that is on rather than a black rectangle. -->
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#FFD36F" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFD36F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#sheen)"/>

  <!-- The display: frame, screen, neck, base. -->
  <rect x="212" y="252" width="600" height="420" rx="48" fill="url(#frame)"/>
  <rect x="238" y="278" width="548" height="368" rx="26" fill="url(#screen)"/>
  <rect x="238" y="278" width="548" height="368" rx="26" fill="url(#glow)"/>
  <rect x="474" y="672" width="76" height="58" fill="url(#frame)"/>
  <rect x="386" y="726" width="252" height="44" rx="22" fill="url(#frame)"/>
</svg>
