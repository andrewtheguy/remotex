<?xml version="1.0" encoding="UTF-8"?>
<!--
  The master artwork for remotex-agent.app's icon. Everything shipped is
  rasterized from this file by packaging/macos/make-icon.sh into AppIcon.icns —
  edit this, run that, commit both.

  LSUIElement means there is no Dock tile, so this icon is not decoration: it is
  what identifies the agent in the Finder, in System Settings > Login Items, in
  the two Privacy & Security lists, and in the TCC permission prompts — the exact
  places a user has to recognise it to grant it anything.

  Why it looks like this:

  * A display, because that is what the agent shares and what its idle menu bar
    icon already is ("display").
  * Bright frame, dark lit screen, nothing on it. The 16x16 rendering is the one
    that has to survive, and at that size the artwork is two tones on a blue
    body: a monitor silhouette reads, anything drawn inside the screen does not.
  * Flat fills and gradients only — no filters. A blur renders differently from
    one rasterizer to the next, and this file is the one thing that must produce
    the same bytes on any machine that regenerates the .icns.

  824x824 body centred in a 1024x1024 canvas with a 185.4 corner radius is
  Apple's macOS icon geometry; the padding is where the system expects to find
  nothing.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B86F5"/>
      <stop offset="1" stop-color="#23349B"/>
    </linearGradient>
    <!-- The soft top-left light every macOS icon body has. -->
    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6F5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152040"/>
      <stop offset="1" stop-color="#0A1022"/>
    </linearGradient>
    <!-- A screen that is on rather than a black rectangle. -->
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#6FE3FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6FE3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#sheen)"/>

  <!-- The display: frame, screen, neck, base. -->
  <rect x="212" y="252" width="600" height="420" rx="48" fill="url(#frame)"/>
  <rect x="238" y="278" width="548" height="368" rx="26" fill="url(#screen)"/>
  <rect x="238" y="278" width="548" height="368" rx="26" fill="url(#glow)"/>
  <rect x="474" y="672" width="76" height="58" fill="url(#frame)"/>
  <rect x="386" y="726" width="252" height="44" rx="22" fill="url(#frame)"/>
</svg>
