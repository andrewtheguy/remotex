# The page's compositor for an RDP host's graphics pipeline, passed through: the
# gateway's own, compiled to WebAssembly. The compositor
# is crates/zdesk-rdp-graphics, which the gateway is built with too, so there is
# one, and this crate is the binding around it.
#
# Built by `bun run build:wasm` in frontend/, into pkg/. Not a member of the
# gateway's workspace, which names it in `exclude`: it builds for
# `wasm32-unknown-unknown` alone, with the profile, the lockfile and the toolchain
# here. The toolchain is a nightly (rust-toolchain.toml), for the threads the
# module decodes on (.cargo/config.toml).
[package]
name = "zdesk-egfx"
version = "0.0.0"
license = "MIT"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
zdesk-rdp-graphics = { path = "../../../crates/zdesk-rdp-graphics" }
rayon = "1"
wasm-bindgen = "0.2"

# For speed, not size: this decodes a desktop's every frame.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd", "--enable-threads"]
