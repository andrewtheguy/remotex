# The page's decoder for a Mac's own picture, as a WebAssembly module of its own:
# one of the Mac's rectangles in, the framebuffer it paints out.
#
# It is the page's alone. A session started with Standard's Adaptive or Full
# quality passes the Mac's rectangles as they came, and the gateway decodes none
# of them, so no crate of the gateway's is shared with it: the decoders are
# src/decoder.rs, written here, for the Adaptive tiles, and src/zlib.rs, on
# miniz_oxide's inflater, for Full's zlib, and this is the binding around them.
#
# Built by `bun run build:wasm` in frontend/, into pkg/, beside the compositor's
# module (../egfx) and the lossless sound's (../flac), and sharing nothing with
# either: no threads, so no shared memory, and the stable toolchain. Not a member
# of the gateway's workspace, which names it in `exclude`: it builds for
# `wasm32-unknown-unknown` alone, with the profile and the lockfile here. The
# `rlib` is for its native tests.
[package]
name = "remotex-vnc"
version = "0.0.0"
license = "MIT"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# SIMD is on (.cargo/config.toml), and wasm-opt is told so.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]
