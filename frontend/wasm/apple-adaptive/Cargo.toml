# The page's decoder for a Mac's Adaptive picture, as a WebAssembly module of its
# own: one of the Mac's rectangles in, the framebuffer it paints out.
#
# It is the page's alone. A session started with Standard's Adaptive quality
# passes the Mac's rectangles as they came, and the gateway decodes none of them,
# so no crate of the gateway's is shared with it: the decoder is src/decoder.rs,
# written here, for the Adaptive tiles, and this is the binding around it. The
# Mac's Full quality is inflated by the gateway and reaches the page as tiles.
#
# Built by `bun run build:wasm` in frontend/, into pkg/, beside the compositor's
# module (../egfx) and the lossless sound's (../flac), and sharing nothing with
# either: no threads, so no shared memory, and the stable toolchain. Not a member
# of the gateway's workspace, which names it in `exclude`: it builds for
# `wasm32-unknown-unknown` alone, with the profile and the lockfile here. The
# `rlib` is for its native tests.
[package]
name = "remotex-apple-adaptive"
version = "0.0.0"
license = "MIT"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# SIMD is on (.cargo/config.toml), and wasm-opt is told so.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]
